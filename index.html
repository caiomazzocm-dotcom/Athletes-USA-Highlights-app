      name:data.name,url:data.url,trackStart:Math.max(0,start),clipStart:0,clipEnd:data.duration,isAudio:isAudio};
    setClipProps(p=>({...p,[clip.id]:{volume:100,scale:1,panX:0,panY:0}}));
    if(isAudio){setAudioTracks(p=>{const n=p.map(t=>t.id===trackId?{...t,clips:[...t.clips,clip].sort((a,b)=>a.trackStart-b.trackStart)}:t);recalcAll(tracks,tagTrack,n);return n;});}
    else{setTracks(p=>{const n=p.map(t=>t.id===trackId?{...t,clips:[...t.clips,clip].sort((a,b)=>a.trackStart-b.trackStart)}:t);recalcAll(n,tagTrack,audioTracks);return n;});compactV1();}
  },[pushHist,recalcAll,tracks,tagTrack,audioTracks,compactV1]);

  const addTag=useCallback((playerId,start,spotX=50,spotY=50)=>{pushHist();
    const player=players.find(p=>p.id===playerId);if(!player)return;
    const playerIdx=players.indexOf(player);
    /* Check if playhead is on a freeze — if so, attach spotlight TO the freeze tag */
    const activeFreeze=findActiveTag(start);
    if(activeFreeze&&activeFreeze.type==="freeze"){
      /* Update the freeze tag to include spotlight data */
      setTagTrack(p=>({...p,clips:p.clips.map(c=>c.id===activeFreeze.id?{...c,playerId,playerName:player.name,playerColor:playerColor(playerIdx),spotX,spotY,spotScale:SPOT_SCALE_DEFAULT,hasSpotlight:true}:c)}));
      setSelectedClipId(activeFreeze.id);
      return;
    }
    /* No freeze at playhead — create standalone overlay tag (duration:0) */
    const clip=findActiveClip(start);
    if(!clip){console.warn("No video clip at playhead for tag");return;}
    const fo=freezeOffset(clip.trackStart,start);
    const sourceTime=clip.clipStart+(start-clip.trackStart-fo);
    const tag={id:uid("tag"),type:"tag",clipId:clip.id,sourceTime,playerId,playerName:player.name,playerColor:playerColor(playerIdx),trackStart:0,duration:0,spotX,spotY,spotScale:SPOT_SCALE_DEFAULT};
    setClipProps(p=>({...p,[tag.id]:{volume:100,scale:1,spotScale:SPOT_SCALE_DEFAULT}}));
    setTagTrack(p=>{const n={...p,clips:[...p.clips,tag]};recalcAll(tracks,n,audioTracks);return n;});
    setSelectedClipId(tag.id);
  },[pushHist,players,findActiveClip,findActiveTag,freezeOffset,recalcAll,tracks,audioTracks]);

  /* ── Add a freeze frame (no spotlight overlay) at the current playhead ── */
  const addFreeze=useCallback((start)=>{pushHist();
    const clip=findActiveClip(start);
    if(!clip){console.warn("No video clip at playhead for freeze");return;}
    const fo=freezeOffset(clip.trackStart,start);
    const sourceTime=clip.clipStart+(start-clip.trackStart-fo);
    const tag={id:uid("frz"),type:"freeze",clipId:clip.id,sourceTime,playerId:null,playerName:"FREEZE",playerColor:"#60a5fa",trackStart:0,duration:FREEZE_DUR,spotX:50,spotY:50,spotScale:SPOT_SCALE_DEFAULT};
    setClipProps(p=>({...p,[tag.id]:{volume:100,scale:1,spotScale:SPOT_SCALE_DEFAULT}}));
    const nextTags={...tagTrack,clips:[...tagTrack.clips,tag]};
    setTagTrack(nextTags);
    recalcAll(tracks,nextTags,audioTracks);
    /* Pass the new tag track — compactV1's own copy is a render behind */
    compactV1(nextTags);
    setSelectedClipId(tag.id);
    return{id:tag.id,clip};
  },[pushHist,findActiveClip,freezeOffset,recalcAll,tracks,tagTrack,audioTracks,compactV1]);

  /* Tags belong to whoever owns the clip under the playhead — every clip already
     records the player it came from, so there is nothing to pick. Falls back to the
     open project's player for editor-media clips, and only returns null (→ list)
     when neither exists and there are several players. */
  const tagOwnerAt=useCallback(ph=>{
    const clip=findActiveClip(ph);
    const own=clip&&players.find(p=>p.id===clip.playerId);
    if(own)return own;
    return(activePlayerId&&players.find(p=>p.id===activePlayerId))||(players.length===1?players[0]:null);
  },[findActiveClip,players,activePlayerId]);

  /* Freeze + Tag in one action: freeze the frame, then the next click on the
     preview places that player's spotlight on this exact freeze. Esc leaves a
     plain freeze. The freeze is targeted by id, not by re-finding it under the
     playhead, so a float rounding at its start edge can't send the spotlight to a
     new standalone tag instead. */
  const pendingFreezeRef=useRef(null);
  const attachSpotlight=useCallback((freezeId,playerId,spotX,spotY)=>{
    const player=players.find(p=>p.id===playerId);if(!player)return;
    pushHist();
    setTagTrack(p=>({...p,clips:p.clips.map(c=>c.id===freezeId?{...c,playerId,playerName:player.name,playerColor:playerColor(players.indexOf(player)),spotX,spotY,hasSpotlight:true}:c)}));
    setSelectedClipId(freezeId);
  },[players,pushHist]);
  const freezeAndTag=useCallback(()=>{
    const res=addFreeze(playhead);if(!res)return;
    const own=players.find(p=>p.id===res.clip.playerId)||tagOwnerAt(playhead);
    pendingFreezeRef.current=res.id;
    if(own){setSpotlightMode(own.id);setShowTagMenu(false);}
    else setShowTagMenu(true);
  },[addFreeze,players,tagOwnerAt,playhead]);

  const updateTagPos=useCallback((tagId,newX,newY)=>{
    setTagTrack(p=>({...p,clips:p.clips.map(c=>c.id===tagId?{...c,spotX:Math.max(5,Math.min(95,newX)),spotY:Math.max(5,Math.min(95,newY))}:c)}));
  },[]);

  const moveClip=useCallback((from,clipId,newStart,to)=>{pushHist();let mc=null;
    let foundInVideo=false;
    setTracks(p=>{let n=p.map(t=>{if(t.id===from){const c=t.clips.find(x=>x.id===clipId);if(c){mc={...c,trackStart:Math.max(0,newStart)};foundInVideo=true;}return{...t,clips:t.clips.filter(x=>x.id!==clipId)};}return t;});
      if(mc&&foundInVideo){const tid=to||from;n=n.map(t=>t.id===tid?{...t,clips:[...t.clips,mc].sort((a,b)=>a.trackStart-b.trackStart)}:t);}recalcAll(n,tagTrack,audioTracks);return n;});
    if(!foundInVideo){setAudioTracks(p=>{let n=p.map(t=>{if(t.id===from){const c=t.clips.find(x=>x.id===clipId);if(c)mc={...c,trackStart:Math.max(0,newStart)};return{...t,clips:t.clips.filter(x=>x.id!==clipId)};}return t;});
      if(mc){const tid=to||from;n=n.map(t=>t.id===tid?{...t,clips:[...t.clips,mc].sort((a,b)=>a.trackStart-b.trackStart)}:t);}recalcAll(tracks,tagTrack,n);return n;});}
  },[pushHist,recalcAll,tracks,tagTrack,audioTracks]);

  const updateClipEdge=useCallback((trackId,clipId,isLeft,newPos,isAudio=false,isTag=false)=>{
    if(isTag){
      /* For source-anchored tags, only adjust duration. Left edge does nothing (sourceTime is fixed). Right edge changes duration. */
      if(!isLeft){
        const resolved=resolvedTags.find(t=>t.id===clipId);if(!resolved)return;
        const newDur=Math.min(TAG_MAX_DUR,Math.max(0.1,newPos-resolved._tlStart));
        setTagTrack(p=>{const n={...p,clips:p.clips.map(c=>c.id===clipId?{...c,duration:newDur}:c)};recalcAll(tracks,n,audioTracks);return n;});
      }
    }else if(isAudio){
      setAudioTracks(p=>{const n=p.map(t=>{if(t.id!==trackId)return t;return{...t,clips:t.clips.map(c=>{if(c.id!==clipId)return c;if(isLeft){const newStart=newPos;const dur=c.clipEnd-c.clipStart;const durReduction=c.trackStart-newStart;if(durReduction>=-0.1){const newClipStart=c.clipStart+durReduction;return{...c,trackStart:Math.max(0,newStart),clipStart:Math.max(0,newClipStart)};}return c;}else{const dur=c.clipEnd-c.clipStart;const newEnd=newPos;const newClipEnd=c.clipStart+(dur+(newEnd-c.trackStart-dur));return{...c,clipEnd:newClipEnd};}return c;})};});recalcAll(tracks,tagTrack,n);return n;});
    }else{
      /* a dragged edge lands on the nearest frame of that video */
      const onFrame=(n,left)=>{if(!fpsOf(n))return n;if(left){const st=snapF(n,n.clipStart,"round");return{...n,trackStart:Math.max(0,n.trackStart+(st-n.clipStart)),clipStart:st};}return{...n,clipEnd:snapF(n,n.clipEnd,"round")};};
      setTracks(p=>{const n=p.map(t=>{if(t.id!==trackId)return t;return{...t,clips:t.clips.map(c=>{if(c.id!==clipId)return c;if(isLeft){const newStart=newPos;const dur=c.clipEnd-c.clipStart;const durReduction=c.trackStart-newStart;if(durReduction>=-0.1){const newClipStart=c.clipStart+durReduction;return onFrame({...c,trackStart:Math.max(0,newStart),clipStart:Math.max(0,newClipStart)},true);}return c;}else{const dur=c.clipEnd-c.clipStart;const newEnd=newPos;const newClipEnd=c.clipStart+(dur+(newEnd-c.trackStart-dur));return onFrame({...c,clipEnd:newClipEnd},false);}return c;})};});recalcAll(n,tagTrack,audioTracks);return n;});
    }
  },[recalcAll,tracks,tagTrack,audioTracks,resolvedTags]);

  /* The split is computed up front rather than inside a setState updater, so the two
     new clip ids exist before the tags are re-pointed at them. Compacting first and
     re-pointing after left every tag orphaned at compaction time, and V1 closed up
     over the freeze it was supposed to leave room for. */
  const cutClip=useCallback((trackId,clipId,atT)=>{const playhead=atT!=null?atT:playheadRef.current;
    const isVideo=tracks.some(t=>t.clips.some(c=>c.id===clipId));
    const srcTrks=isVideo?tracks:audioTracks;
    const trk=srcTrks.find(t=>t.id===trackId);if(!trk)return;
    const c=trk.clips.find(x=>x.id===clipId);if(!c)return;
    const d=c.clipEnd-c.clipStart;const fo=freezeOffset(c.trackStart,playhead);
    /* the cut goes exactly at the start of the frame the preview is showing */
    const cut=snapF(c,c.clipStart+(playhead-c.trackStart-fo),"floor")-c.clipStart;
    if(cut<=.02||cut>=d-.02)return;
    pushHist();
    const a={...c,id:uid("clip"),clipEnd:c.clipStart+cut};
    const b={...c,id:uid("clip"),trackStart:c.trackStart+fo+cut,clipStart:c.clipStart+cut};
    const splitSourceTime=c.clipStart+cut;
    setClipProps(p=>({...p,[a.id]:{...(p[c.id]||{volume:100,scale:1,panX:0,panY:0})},[b.id]:{...(p[c.id]||{volume:100,scale:1,panX:0,panY:0})}}));
    const applied=srcTrks.map(t=>t.id!==trackId?t:{...t,clips:t.clips.filter(x=>x.id!==clipId).concat([a,b]).sort((x,y)=>x.trackStart-y.trackStart)});
    /* Each tag follows whichever half still contains its source frame */
    const nextTags={...tagTrack,clips:tagTrack.clips.map(tg=>tg.clipId!==clipId?tg:(tg.sourceTime<splitSourceTime?{...tg,clipId:a.id}:{...tg,clipId:b.id}))};
    setTagTrack(nextTags);
    if(isVideo){setTracks(applied);recalcAll(applied,nextTags,audioTracks);compactV1(nextTags);}
    else{setAudioTracks(applied);recalcAll(tracks,nextTags,applied);}
    setSelectedClipId(null);
  },[pushHist,playhead,tracks,tagTrack,audioTracks,recalcAll,compactV1,freezeOffset]);

  const cutTag=useCallback((tagId)=>{pushHist();
    const resolved=resolvedTags.find(t=>t.id===tagId);if(!resolved)return;
    const tlStart=resolved._tlStart;
    const cut=playhead-tlStart;if(cut<=.05||cut>=resolved.duration-.05)return;
    setTagTrack(p=>{const c=p.clips.find(x=>x.id===tagId);if(!c)return p;
      const a={...c,id:uid("tag"),duration:cut};const b={...c,id:uid("tag"),sourceTime:c.sourceTime,duration:c.duration-cut};
      setClipProps(pr=>({...pr,[a.id]:{...(pr[c.id]||{volume:100,scale:1,spotScale:SPOT_SCALE_DEFAULT})},[b.id]:{...(pr[c.id]||{volume:100,scale:1,spotScale:SPOT_SCALE_DEFAULT})}}));
      const n={...p,clips:p.clips.filter(x=>x.id!==tagId).concat([a,b])};recalcAll(tracks,n,audioTracks);return n;});
    setSelectedClipId(null);
  },[pushHist,playhead,tracks,audioTracks,recalcAll,resolvedTags]);

  const delClip=useCallback(()=>{if(!selectedClipId)return;pushHist();
    /* Find the deleted clip's start position BEFORE removal — playhead will snap here */
    let deletedStart=null;
    [...tracks,...audioTracks].forEach(t=>t.clips.forEach(c=>{if(c.id===selectedClipId)deletedStart=c.trackStart;}));
    tagTrack.clips.forEach(c=>{if(c.id===selectedClipId)deletedStart=c._tlStart||c.trackStart||0;});

    setTracks(p=>{const n=p.map(t=>({...t,clips:t.clips.filter(c=>c.id!==selectedClipId)}));recalcAll(n,tagTrack,audioTracks);return n;});
    setAudioTracks(p=>{const n=p.map(t=>({...t,clips:t.clips.filter(c=>c.id!==selectedClipId)}));recalcAll(tracks,tagTrack,n);return n;});
    /* Remove tag if it's the selected item, OR remove all tags anchored to this clip */
    const nextTags={...tagTrack,clips:tagTrack.clips.filter(c=>c.id!==selectedClipId&&c.clipId!==selectedClipId)};
    setTagTrack(nextTags);
    recalcAll(tracks,nextTags,audioTracks);
    /* Compact against the tags that remain, or V1 keeps room for the deleted freeze */
    compactV1(nextTags);
    /* Snap playhead to where the deleted clip was (after compaction, the next clip slides here) */
    if(deletedStart!==null)setPlayhead(deletedStart);
    setSelectedClipId(null);
  },[selectedClipId,pushHist,recalcAll,tracks,tagTrack,audioTracks,compactV1]);

  const closeGaps=useCallback(()=>{pushHist();
    const closeTrackGaps=(clips,includeTags)=>{const sorted=[...clips].sort((a,b)=>brandRank(a)-brandRank(b)||a.trackStart-b.trackStart);let pos=0;return sorted.map(c=>{
      const rawD=c.clipEnd-c.clipStart;
      let fz=0;
      if(includeTags)tagTrack.clips.forEach(tg=>{if(tg.clipId===c.id&&tg.sourceTime>=c.clipStart&&tg.sourceTime<c.clipEnd)fz+=tg.duration;});
      const newC={...c,trackStart:pos};pos+=rawD+fz;return newC;});};
    setTracks(p=>{const n=p.map(t=>({...t,clips:closeTrackGaps(t.clips,true)}));recalcAll(n,tagTrack,audioTracks);return n;});
    setAudioTracks(p=>{const n=p.map(t=>({...t,clips:closeTrackGaps(t.clips,false)}));recalcAll(tracks,tagTrack,n);return n;});
  },[pushHist,recalcAll,tracks,tagTrack,audioTracks]);

  const undo=useCallback(()=>{if(!history.length)return;const prev=history[history.length-1];setFuture(f=>[...f.slice(-40),allState()]);setTracks(prev.v);setTagTrack(prev.t);setAudioTracks(prev.a);setHistory(h=>h.slice(0,-1));recalcAll(prev.v,prev.t,prev.a);},[history,recalcAll,allState]);
  const redo=useCallback(()=>{if(!future.length)return;const nx=future[future.length-1];setHistory(h=>[...h.slice(-40),allState()]);setTracks(nx.v);setTagTrack(nx.t);setAudioTracks(nx.a);setFuture(f=>f.slice(0,-1));recalcAll(nx.v,nx.t,nx.a);},[future,recalcAll,allState]);
  const addTrack=()=>setTracks(p=>[...p,{id:uid("trk"),name:`V${p.length+1}`,clips:[]}]);
  const addAudioTrack=()=>setAudioTracks(p=>[...p,{id:uid("atrk"),name:`A${p.length+1}`,clips:[]}]);

  /* ═══ SNAP HELPER ═══ */
  const SNAP_THRESH=8;/* pixels */
  const snapToEdges=useCallback((timeSec,clipId,clipDur)=>{
    if(!snapOn){setSnapLine(null);return timeSec;}
    const edges=[];
    /* playhead */
    edges.push(playhead);
    /* collect all clip edges except the one being moved */
    [...tracks,...audioTracks].forEach(t=>t.clips.forEach(c=>{if(c.id===clipId)return;const d=c.clipEnd-c.clipStart;edges.push(c.trackStart);edges.push(c.trackStart+d);}));
    resolvedTags.forEach(c=>{if(c.id===clipId)return;edges.push(c._tlStart);edges.push(c._tlStart+c.duration);});
    const threshSec=SNAP_THRESH/zoom;
    let best=timeSec;let bestDist=Infinity;let snapEdge=null;
    /* snap leading edge (start) */
    for(const e of edges){const d=Math.abs(timeSec-e);if(d<threshSec&&d<bestDist){bestDist=d;best=e;snapEdge=e;}}
    /* snap trailing edge (end) if we know clip duration */
    if(clipDur>0){const endT=timeSec+clipDur;for(const e of edges){const d=Math.abs(endT-e);if(d<threshSec&&d<bestDist){bestDist=d;best=e-clipDur;snapEdge=e;}}}
    if(snapEdge!==null){setSnapLine(snapEdge);clearTimeout(snapLineTimer.current);snapLineTimer.current=setTimeout(()=>setSnapLine(null),400);}
    else{setSnapLine(null);}
    return Math.max(0,best);
  },[snapOn,playhead,tracks,audioTracks,resolvedTags,zoom]);

  /* magnetPush removed — replaced by compactV1 ripple mode above */

  /* ═══ ZOOM TO FIT ═══ */
  const zoomToFit=useCallback(()=>{
    let contentEnd=0;
    tracks.forEach(t=>t.clips.forEach(c=>{const e=c.trackStart+(c.clipEnd-c.clipStart);if(e>contentEnd)contentEnd=e;}));
    resolvedTags.forEach(c=>{const e=c._tlStart+c.duration;if(e>contentEnd)contentEnd=e;});
    audioTracks.forEach(t=>t.clips.forEach(c=>{const e=c.trackStart+(c.clipEnd-c.clipStart);if(e>contentEnd)contentEnd=e;}));
    if(contentEnd<=0)return;
    const el=tlScrollRef.current;if(!el)return;
    const availW=el.clientWidth-20;/* small padding */
    const newZoom=Math.max(2,Math.min(ZOOM_MAX,availW/contentEnd));
    setZoom(newZoom);
    if(el)el.scrollLeft=0;
  },[tracks,resolvedTags,audioTracks]);

  /* ═══ VIDEO EXPORT ═══
     KEY DESIGN: Video elements for drawImage are NEVER connected to AudioContext.
     createMediaElementSource() can cause browsers to stop decoding video frames.
     Instead we use SEPARATE audio elements for sound capture.

     Architecture:
     - videoEls{} = per-clip <video> for canvas drawImage (pure video, no AudioContext)
     - audioEls{} = per-clip <audio> connected to AudioContext for sound capture
     - Both load from same blob URLs (downloaded from Firebase Storage)
     - Frame-by-frame stepping with seek+wait for guaranteed frame accuracy */
  const exportVideo=useCallback(async(opts={})=>{
    setIsPlaying(false);if(animRef.current)cancelAnimationFrame(animRef.current);
    setExporting(true);setExportProgress(0);exportCancelRef.current=false;

    /* Master try/catch — ensures UI is ALWAYS restored even if export throws */
    let exportContainer=null;
    try{

    /* ── PRE-COMPUTE A FLAT RENDER LIST ──
       Instead of using findActiveClip/freezeOffset during export (which causes timing
       bugs at cut boundaries), we pre-compute the exact render instruction for every
       frame. This eliminates pauses/freezes at cuts. */
    const allClips=[];tracks.forEach(t=>t.clips.forEach(c=>allClips.push(c)));

    const imageClipIds=new Set(allClips.filter(c=>c.kind==="image").map(c=>c.id));
    /* Build a flat segment list: [{clipId, tlStart, tlEnd, srcStart, srcEnd, isTag, tag}] */
    const segments=[];
    allClips.forEach(cl=>{
      /* Find tags that belong to this clip */
      const clipTags=resolvedTags.filter(tg=>tg.clipId===cl.id&&tg.sourceTime>=cl.clipStart&&tg.sourceTime<cl.clipEnd).sort((a,b)=>a.sourceTime-b.sourceTime);
      /* Separate freeze tags (duration>0) from overlay-only tags (duration===0) */
      const freezeTags=clipTags.filter(tg=>tg.duration>0);
      const overlayTags=clipTags.filter(tg=>tg.duration===0);
      let tlPos=cl.trackStart;let srcPos=cl.clipStart;
      freezeTags.forEach(tg=>{
        const tagSrcT=tg.sourceTime;
        /* Video segment before this tag */
        if(tagSrcT>srcPos){
          segments.push({clipId:cl.id,url:cl.url,tlStart:tlPos,tlEnd:tlPos+(tagSrcT-srcPos),srcStart:srcPos,srcEnd:tagSrcT,isTag:false});
          tlPos+=tagSrcT-srcPos;
        }
        /* Tag segment: freeze frame with spotlight overlay. Duration = tag.duration.
           srcStart === srcEnd so the video stays on this exact frame.
           Same runaway guard the resize handle uses, so export matches the timeline. */
        const safeDur=Math.min(TAG_MAX_DUR,tg.duration);
        segments.push({clipId:cl.id,url:cl.url,tlStart:tlPos,tlEnd:tlPos+safeDur,srcStart:tagSrcT,srcEnd:tagSrcT,isTag:true,tag:tg});
        tlPos+=safeDur;
        srcPos=tagSrcT;
      });
      /* Remaining video after last freeze tag */
      if(srcPos<cl.clipEnd){
        segments.push({clipId:cl.id,url:cl.url,tlStart:tlPos,tlEnd:tlPos+(cl.clipEnd-srcPos),srcStart:srcPos,srcEnd:cl.clipEnd,isTag:false,overlayTags});
      }
    });
    /* Also add freeze tags not bound to a clip */
    resolvedTags.filter(tg=>!tg.clipId&&tg.duration>0).forEach(tg=>{
      const parentClip=allClips.find(c=>tg._tlStart>=c.trackStart);
      segments.push({clipId:parentClip?.id,url:parentClip?.url,tlStart:tg._tlStart,tlEnd:tg._tlStart+tg.duration,srcStart:tg.sourceTime||0,srcEnd:tg.sourceTime||0,isTag:true,tag:tg});
    });
    segments.sort((a,b)=>a.tlStart-b.tlStart);
    const introClip=allClips.find(c=>c.brand==="intro"&&c.url);
    const introSegEnds=introClip?segments.filter(sg=>sg.clipId===introClip.id).map(sg=>sg.tlEnd):[];
    const introEnd=introSegEnds.length?Math.max(...introSegEnds):null;

    /* Compute content end */
    let cEnd=0;
    segments.forEach(s=>{if(s.tlEnd>cEnd)cEnd=s.tlEnd;});
    audioTracks.forEach(t=>t.clips.forEach(c=>{const e=c.trackStart+(c.clipEnd-c.clipStart);if(e>cEnd)cEnd=e;}));
    if(cEnd<=0){setExporting(false);return;}
    /* Output time u maps onto the timeline: the chosen range, then (for social
       clips) the outro appended after it. The whole reel is the default range. */
    const from=opts.range?Math.max(0,opts.range.from):0;
    const to=opts.range?Math.min(cEnd,opts.range.to):cEnd;
    const mainLen=Math.max(0,to-from);
    const outroC=opts.appendOutro?allClips.find(c=>c.brand==="outro"):null;
    const outroSegs=outroC?segments.filter(sg=>sg.clipId===outroC.id):[];
    const oStart=outroSegs.length?Math.min(...outroSegs.map(sg=>sg.tlStart)):null;
    const oEnd=outroSegs.length?Math.max(...outroSegs.map(sg=>sg.tlEnd)):null;
    const addOutro=oStart!=null&&to<=oStart+0.01;
    const outLen=mainLen+(addOutro?oEnd-oStart:0);
    const mapT=u=>u<mainLen?from+u:oStart+(u-mainLen);
    const outroAll=allClips.find(c=>c.brand==="outro");
    const outroSegsAll=outroAll?segments.filter(sg=>sg.clipId===outroAll.id):[];
    const outroTl=outroSegsAll.length?Math.min(...outroSegsAll.map(sg=>sg.tlStart)):null;
    /* in output time, so it works for a social clip with the outro appended too */
    const joinU=addOutro?mainLen:(outroTl!=null&&outroTl>=from&&outroTl<=to?outroTl-from:null);
    if(outLen<=0){setExporting(false);return;}
    if(allClips.some(c=>c.brand==="intro"&&!c.url&&c.trackStart<to&&c.trackStart+(c.clipEnd-c.clipStart)>from)&&!confirm("The intro has no athlete thumbnail yet — it will export as black with the intro sound.\n\nOK = export anyway\nCancel = go back and add the thumbnail")){setExporting(false);return;}

    const fps=30;const totalFrames=Math.ceil(cEnd*fps);
    const hideCss="position:fixed;left:0;bottom:0;width:1px;height:1px;pointer-events:none;z-index:-1;";

    /* Lookup: given a frame time, find the segment */
    const findSeg=(t)=>{
      for(let i=segments.length-1;i>=0;i--){const s=segments[i];if(t>=s.tlStart&&t<s.tlEnd)return s;}

         sub-frame hole between them. Falling into the gap branch there paints a

    /* ── Step 1: Download ALL media URLs as local blobs ── */
    setExportFmt("Downloading media...");
    const blobUrlMap={};const allUrls=new Set();
    tracks.forEach(t=>t.clips.forEach(c=>{if(c.url)allUrls.add(c.url);}));
    audioTracks.forEach(t=>t.clips.forEach(c=>{if(c.url)allUrls.add(c.url);}));
    let dlCount=0,dlFailed=0;const dlTotal=allUrls.size;
    for(const u of allUrls){

    /* ── Step 2: Create video elements for export drawing ──
       Elements are small, nearly transparent, and don't block the UI.
       pointer-events:none ensures they can't be clicked.
       They sit at the bottom-left corner, invisible to the user but
       "visible" enough for the browser to decode frames. */
    setExportFmt("Preparing video...");
    exportContainer=document.createElement("div");
    exportContainer.style.cssText="position:fixed;bottom:0;left:0;width:320px;height:180px;z-index:-1;overflow:hidden;pointer-events:none;opacity:0.01;";
    document.body.appendChild(exportContainer);
    const videoEls={};const imageEls={};
    for(let i=0;i<allClips.length;i++){
      const c=allClips[i];setExportFmt(`Loading video ${i+1}/${allClips.length}...`);
      if(c.kind==="image"){
        if(c.url){const img=new Image();img.src=blobUrlMap[c.url]||c.url;try{await img.decode();}catch(e){}imageEls[c.id]=img;}
        continue;
      }

      vel.playsInline=true;vel.preload="auto";vel.muted=true;
      vel.style.cssText="width:320px;height:180px;position:absolute;top:0;left:0;";
      vel.src=blobUrlMap[c.url]||c.url;
      exportContainer.appendChild(vel);
      await new Promise(resolve=>{
        let done2=false;const finish=()=>{if(!done2){done2=true;videoEls[c.id]=vel;resolve();}};
        vel.addEventListener("canplaythrough",finish,{once:true});

    /* ── Step 3: Verify drawImage (CORS check) ──
       Fill canvas with bright red, then drawImage. If getImageData still shows red,
       drawImage didn't work (CORS/tainted). If pixels changed at all, it's working
       — even if the video frame is very dark (nighttime footage). */
    const testCvs=document.createElement("canvas");testCvs.width=16;testCvs.height=16;const testCx=testCvs.getContext("2d");

    console.log("[Export] drawImage test:",drawWorks?"PASS":"FAIL","readyState:",firstVel?.readyState,"dim:",firstVel?.videoWidth+"x"+firstVel?.videoHeight);
    if(!drawWorks){if(!confirm("⚠️ Canvas CORS test failed. Export may be black.\nThis usually means Firebase CORS is not configured.\nOK=try anyway, Cancel=abort")){

      Object.values(blobUrlMap).forEach(u=>{if(u&&u.startsWith("blob:")&&!allUrls.has(u))try{URL.revokeObjectURL(u);}catch(e){}});

    const actx=new(window.AudioContext||window.webkitAudioContext)();await actx.resume();
    const aDst=actx.createMediaStreamDestination();
    const master=actx.createGain();const comp=actx.createDynamicsCompressor();const masterOut=actx.createGain();
    comp.threshold.value=LOUDNESS.threshold;comp.knee.value=LOUDNESS.knee;comp.ratio.value=LOUDNESS.ratio;comp.attack.value=LOUDNESS.attack;comp.release.value=LOUDNESS.release;
    masterOut.gain.value=LOUDNESS.outGain;
    master.connect(comp).connect(masterOut).connect(aDst);
    const audioEls={};const audioGains={};
    allClips.forEach(c=>{if(c.kind==="image")return;try{const ael=document.createElement("audio");ael.preload="auto";ael.style.cssText=hideCss;ael.src=blobUrlMap[c.url]||c.url;document.body.appendChild(ael);ael.load();
      const src=actx.createMediaElementSource(ael);const gain=actx.createGain();gain.gain.value=0;src.connect(gain).connect(master);audioEls[c.id]=ael;audioGains[c.id]=gain;}catch(e){}});
    /* clips whose sound was detached onto an audio track stay silent here */
    const mutedIds=new Set(allClips.filter(c=>c.audioDetached).map(c=>c.id));
    /* Audio-track clips: one element + gain each, so music, the intro sound and
       detached clip sound all play together. They run on timeline time and keep

    const trackAud={};
    audioTracks.forEach(t=>t.clips.forEach(c=>{if(!c.url)return;try{
      const el=document.createElement("audio");el.preload="auto";el.style.cssText=hideCss;el.src=blobUrlMap[c.url]||c.url;document.body.appendChild(el);el.load();

    /* ── Step 5: Canvas + MediaRecorder ── */
    const W=opts.W||1920,H=opts.H||1080;
    const cvs=document.createElement("canvas");cvs.width=W;cvs.height=H;
    const cx=cvs.getContext("2d");cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";
    const cStream=cvs.captureStream(fps);
    const mStream=new MediaStream([...cStream.getVideoTracks(),...aDst.stream.getAudioTracks()]);
    /* Prefer MP4 (H.264/AAC) for YouTube compatibility, fall back to WebM.
       Chrome 120+ supports MP4 in MediaRecorder. Older browsers get WebM. */
    const mimes=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];

    const chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};

    const cleanup=()=>{
      try{actx.close();}catch(e){}
      Object.values(videoEls).forEach(v=>{try{v.pause();v.removeAttribute("src");v.load();}catch(e){}});
      Object.values(audioEls).forEach(a=>{try{a.pause();a.removeAttribute("src");a.load();document.body.removeChild(a);}catch(e){}});
      Object.values(trackAud).forEach(x=>{try{x.el.pause();x.el.removeAttribute("src");x.el.load();x.el.remove();}catch(e){}});
      try{exportContainer.remove();}catch(e){}
      Object.values(blobUrlMap).forEach(u=>{if(u&&u.startsWith("blob:")&&!allUrls.has(u))try{URL.revokeObjectURL(u);}catch(e){}});
    };

    /* ── Drawing helpers ── */

    /* CANONICAL TRANSFORM: one function used by both preview and export.
       Computes where the video lands on the output canvas, replicating

    const computeVideoTransform=(srcW,srcH,outW,outH,scale,panX,panY)=>{

    /* Last successfully drawn frame. A seek (every cut, every freeze) takes a few

    /* drawVideoFit: draws video onto canvas using the canonical transform.

    /* Where the 16:9 frame (the preview box) sits on this canvas. Landscape:

    const FULLBOX={x:0,y:0,w:W,h:H};

    const boxFor=(clipId,t)=>{
      if(!narrow||!clipId||!clipById[clipId])return FULLBOX;
      const f=socialFrame(clipById[clipId],clipProps,tagTrack.clips,t);

    /* drawSpotlight: overlay rendering that matches preview EXACTLY.

       KEY INSIGHT: In the preview, spotX/spotY are percentages of the
       PREVIEW CONTAINER (a 16:9 box), NOT percentages of the video frame.
       The spotlight overlay is positioned with CSS left:${sx}%, top:${sy}%
       relative to the container — same coordinate space as the canvas.

       The preview container IS 16:9 (same as the export canvas 1920×1080).
       So spotX% of container width = spotX% of 1920 in export. This is correct.

       The preview spotlight circle radius is 80px * spotScale at a ~720px wide

    const drawSpotlight=(tag,opacity,box=FULLBOX)=>{

    /* ── Step 6: Real-time export loop ──

    if(from>0){const s0=findSeg(mapT(0));const v0=s0&&!s0.isTag&&videoEls[s0.clipId];

    await new Promise(resolve=>{
      rec.onstop=()=>{
        try{document.removeEventListener("visibilitychange",onVis);}catch(e){}

        if(!exportCancelRef.current){
          const u=URL.createObjectURL(blob);const a=document.createElement("a");
          a.href=u;a.download=`${opts.fileName||("AthletesUSA_Highlight_"+new Date().toISOString().slice(0,10))}.${ext}`;

        if(ph>=outLen){rec.stop();return;}

            const ip=propsAt(clipProps[seg.clipId]||{scale:1,panX:0,panY:0},segSrcT);
            drew=drawVideoFit(imageEls[seg.clipId],ip.scale||1,ip.panX||0,ip.panY||0,box);
          }else if(vel){

            /* Use clip's actual scale — NOT hardcoded 1 — so vertical videos

               intro sound comes from A1 below */

            if(segIdx!==curSegIdx){curSegIdx=segIdx;
              Object.values(videoEls).forEach(v=>{if(!v.paused)v.pause();});
              Object.values(audioGains).forEach(g=>g.gain.value=0);
              if(curAudEl){curAudEl.pause();curAudEl=null;}}
            const img=imageEls[seg.clipId];
            if(img){

  /* keepSel: the ruler only moves the playhead. Deselecting there made the clip's

  const handleTlClick=(e,keepSel)=>{const scrollEl=tlScrollRef.current;if(!scrollEl)return;const r=scrollEl.getBoundingClientRect();const scrollL=scrollEl.scrollLeft;
    let t=Math.max(0,(e.clientX-r.left+scrollL)/zoom);
    const fr=frameAtTime(t);if(fr&&fr.dur*zoom>=4)t=fr.start+FRAME_IN;
    setPlayhead(t);if(!keepSel)setSelectedClipId(null);};
  const handlePlayheadDrag=e=>{e.stopPropagation();e.preventDefault();const scrollEl=tlScrollRef.current;if(!scrollEl)return;
    const parent=scrollEl.querySelector("[data-tl-area]")||scrollEl;

                  {/* Render freeze segments inline within the clip */}
                  {(()=>{let fzAccum=0;return clipFreezes.map(fz=>{
                    const offsetInClip=(fz.sourceTime-clip.clipStart)+fzAccum;

                </div>);})}

/* ═══════════ ROOT APP ═══════════ */
const STORAGE_KEY_PLAYERS="aua_players";
const STORAGE_KEY_SESSION="aua_studio_session";
const STORAGE_KEY_EDVIDS="aua_editor_vids";
const STORAGE_KEY_EDMUSIC="aua_editor_music";
const STORAGE_KEY_EDIMGS="aua_editor_imgs";
/* The Studio timeline itself — tracks, tags and per-clip settings — so an edit
   session survives a reload instead of starting from zero every time. */
const STORAGE_KEY_PROJECT="aua_studio_project";
/* AUSA brand template. Every project opens with an intro slot (the athlete's
   thumbnail over the AUSA sound) and closes with the AUSA outro; clips always go
   between them. Files live in brand/ beside index.html — same origin, so the
   export can draw them without CORS setup. Both are 0:07–0:13 of the AUSA video. */
const BRAND={outro:"brand/outro.mp4",introAudio:"brand/intro-audio.m4a",introDur:5,outroDur:6};
/* The intro's look, shared by preview and export so what you scrub is what you
   export: a slow Ken Burns push and drift across the thumbnail, then a zoom-blur
   that carries through the cut and clears over the first half-second of the clip.
   blur is a fraction of frame width; each renderer scales it to its own size. */
const INTRO_FX={push:0.08,pan:40,outDur:0.7,outZoom:0.22,inDur:0.5,inZoom:0.14,blur:0.012};
const smoothStep=x=>x*x*(3-2*x);
const introFx=(t,dur)=>{
  const p=Math.max(0,Math.min(1,dur>0?t/dur:0));
  let scale=1+INTRO_FX.push*smoothStep(p),blur=0;
  const panX=-INTRO_FX.pan+2*INTRO_FX.pan*smoothStep(p);

    const nc={...c,trackStart:pos};pos+=(c.clipEnd-c.clipStart)+fz;return nc;});};
const SESSION_DURATION_MS=30*60*1000;

const loadPlayers=()=>{try{const d=localStorage.getItem(STORAGE_KEY_PLAYERS);if(d){const parsed=JSON.parse(d);return parsed.map(p=>({...p,categories:p.categories.map(c=>({...c,videos:c.videos.map(v=>({...v,url:v.cloudUrl||v.url||""}))}))}));}return[];}catch(e){return[];}};
const savePlayers=players=>{try{const safe=players.map(p=>({...p,categories:p.categories.map(c=>({...c,videos:c.videos.map(v=>({id:v.id,name:v.name,duration:v.duration,cloudUrl:v.cloudUrl||""}))}))}));localStorage.setItem(STORAGE_KEY_PLAYERS,JSON.stringify(safe));}catch(e){}};
const isSessionValid=()=>{try{const ts=localStorage.getItem(STORAGE_KEY_SESSION);if(!ts)return false;return(Date.now()-parseInt(ts,10))<SESSION_DURATION_MS;}catch(e){return false;}};
const saveSession=()=>{try{localStorage.setItem(STORAGE_KEY_SESSION,String(Date.now()));}catch(e){}};

/* ═══ ATHLETE IDENTITY (localStorage) ═══ */
const STORAGE_KEY_ATHLETE_ID="aua_my_player_id";
const STORAGE_KEY_ATHLETE_PHONE="aua_my_phone";
const getMyPlayerId=()=>{try{return localStorage.getItem(STORAGE_KEY_ATHLETE_ID)||null;}catch(e){return null;}};
const setMyPlayerId=(id)=>{try{if(id)localStorage.setItem(STORAGE_KEY_ATHLETE_ID,id);else localStorage.removeItem(STORAGE_KEY_ATHLETE_ID);}catch(e){}};
const getMyAthletePhone=()=>{try{return localStorage.getItem(STORAGE_KEY_ATHLETE_PHONE)||null;}catch(e){return null;}};
const setMyAthletePhone=(p)=>{try{if(p)localStorage.setItem(STORAGE_KEY_ATHLETE_PHONE,p);else localStorage.removeItem(STORAGE_KEY_ATHLETE_PHONE);}catch(e){}};

function App(){
  /* ── Hash-based routing ──
     Routes: "" or "/" = combined landing (backward compat)
             "athlete" = athlete-only entry (NO studio access)
             "studio"  = studio entry (password-gated, CAN access athlete pages) */
  const[route,setRoute]=useState(getHashRoute);
  const[screen,setScreen]=useState("landing"); /* "landing"|"athlete"|"editor" */
  const[overlayName,setOverlayName]=useState(null); /* non-null → show SpotlightTagGenerator */
  const[players,setPlayers]=useState([]);
  const[activePlayerId,setActivePlayerId]=useState(null);
  const[athleteStep,setAthleteStep]=useState("select");
  const[showOnboarding,setShowOnboarding]=useState(false);
  const[hydrated,setHydrated]=useState(false);
  const[cloudLoading,setCloudLoading]=useState(true);
  const[studioAuth,setStudioAuth]=useState(isSessionValid()); /* editor authenticated? */
  const[isEditorMode,setIsEditorMode]=useState(false); /* true when entering from studio route */
  const[videoStatuses,setVideoStatuses]=useState({});
  const[allBatches,setAllBatches]=useState({}); /* {playerId: [batch, ...]} */
  const refreshBatches=async()=>{try{const b=await loadAllBatches();setAllBatches(b);}catch(e){}};

  /* Listen for hash changes */
  useEffect(()=>{
    const onHash=()=>{const r=getHashRoute();setRoute(r);};
    window.addEventListener("hashchange",onHash);
    return()=>window.removeEventListener("hashchange",onHash);
  },[]);

  /* Load players from Firestore on mount, then auto-login athlete if possible */
  useEffect(()=>{(async()=>{let loadedPlayers=[];try{
    const cloud=await loadPlayersFromCloud();
    if(cloud.length>0){loadedPlayers=await hydratePlayerVideos(cloud);}
    else{const local=loadPlayers();if(local.length>0){loadedPlayers=await hydratePlayerVideos(local);}}
    setPlayers(loadedPlayers);setHydrated(true);setCloudLoading(false);
    /* Load video statuses and batches */
    try{const allSt=await loadAllVideoStatuses();const byVid={};Object.values(allSt).forEach(s=>{byVid[s.videoId]=s;});setVideoStatuses(byVid);}catch(e){}
    try{const b=await loadAllBatches();setAllBatches(b);}catch(e){}
  }catch(e){console.warn("Init load error:",e);
    try{const local=loadPlayers();loadedPlayers=await hydratePlayerVideos(local);setPlayers(loadedPlayers);}catch(e2){}
    setHydrated(true);setCloudLoading(false);
  }
  /* Auto-login: if on #/athlete route, try phone first, then player ID */
  const r=getHashRoute();
  if(r==="athlete"){
    const myPhone=getMyAthletePhone();
    const myId=getMyPlayerId();
    /* Try phone-based lookup first (survives across devices if same browser) */
    if(myPhone){
      const normalizeP=p=>(p||"").replace(/[^0-9]/g,"");
      const match=loadedPlayers.find(p=>normalizeP(p.phone)===normalizeP(myPhone));
      if(match){setMyPlayerId(match.id);setActivePlayerId(match.id);setScreen("athlete");setAthleteStep("portal");setIsEditorMode(false);return;}
    }
    /* Fallback to player ID */
    if(myId){const myPlayer=loadedPlayers.find(p=>p.id===myId);
      if(myPlayer){setActivePlayerId(myId);setScreen("athlete");setAthleteStep("portal");setIsEditorMode(false);return;}}
    /* No stored identity — show login screen */
    setIsEditorMode(false);setScreen("athlete");setAthleteStep("select");
  }
  })();},[]);

  useEffect(()=>{if(hydrated)savePlayers(players);},[players,hydrated]);

  const activePlayer=players.find(p=>p.id===activePlayerId)||null;

  const handleCreateProfile=data=>{
    const newPlayer={id:uid("pl"),name:data.name,recruitingClass:data.recruitingClass,size:data.size,dob:data.dob,
      shirtNumber:data.shirtNumber||"",uniformDesc:data.uniformDesc||"",positions:data.positions||[],profilePicUrl:data.profilePicUrl||"",playingPicUrl:data.playingPicUrl||"",
      phone:data.phone||"",
      categories:DEFAULT_CATS.map(n=>({id:uid("cat"),name:n,videos:[]}))};
    setPlayers(p=>[...p,newPlayer]);setActivePlayerId(newPlayer.id);setAthleteStep("portal");
    /* Save phone as athlete identity so they auto-login next time */
    if(!isEditorMode&&data.phone){setMyAthletePhone(data.phone);setMyPlayerId(newPlayer.id);}
    /* Show onboarding guide for new athlete profiles */
    if(!isEditorMode)setShowOnboarding(true);
    savePlayerToCloud(newPlayer);
  };
  const handleDeletePlayer=async(playerId)=>{
    const pl=players.find(p=>p.id===playerId);
    if(pl){for(const cat of pl.categories)for(const v of cat.videos){deleteBlob(v.id).catch(()=>{});deleteVideoFromCloud(v.id).catch(()=>{});}}
    deletePlayerFromCloud(playerId).catch(()=>{});
    setPlayers(p=>p.filter(pl=>pl.id!==playerId));
    /* Clear localStorage identity if this was the logged-in athlete */
    if(getMyPlayerId()===playerId){setMyPlayerId(null);setMyAthletePhone(null);}
    if(activePlayerId===playerId){setActivePlayerId(null);setAthleteStep("select");}
  };
  const handleUpdatePlayer=updated=>{setPlayers(p=>p.map(pl=>pl.id===updated.id?updated:pl));};

  /* ── Navigation helpers ── */
  const goToLanding=()=>{setScreen("landing");setAthleteStep("select");setActivePlayerId(null);};
  const enterAthlete=()=>{
    setIsEditorMode(false);
    /* Auto-login: try phone first, then player ID */
    const myPhone=getMyAthletePhone();
    const normalizeP=p=>(p||"").replace(/[^0-9]/g,"");
    if(myPhone){
      const match=players.find(p=>normalizeP(p.phone)===normalizeP(myPhone));
      if(match){setActivePlayerId(match.id);setScreen("athlete");setAthleteStep("portal");return;}
    }
    const myId=getMyPlayerId();
    if(myId){
      const myPlayer=players.find(p=>p.id===myId);
      if(myPlayer){setActivePlayerId(myId);setScreen("athlete");setAthleteStep("portal");return;}
      setMyPlayerId(null);
    }
    setScreen("athlete");setAthleteStep("select");
  };
  const enterAthleteAsEditor=()=>{setIsEditorMode(true);setScreen("athlete");setAthleteStep("select");};
  const enterStudio=()=>{setStudioAuth(true);setScreen("editor");};
  const athleteSignOut=()=>{
    if(!isEditorMode){setMyPlayerId(null);setMyAthletePhone(null);} /* Clear stored identity on sign-out */
    goToLanding();
  };
  const refreshPlayers=async()=>{try{const cp=await loadPlayersFromCloud();if(cp.length>0){const hp=await hydratePlayerVideos(cp);setPlayers(hp);}}catch(e){console.warn("Refresh failed:",e);}};
  const refreshStatuses=async()=>{try{const allSt=await loadAllVideoStatuses();const byVid={};Object.values(allSt).forEach(s=>{byVid[s.videoId]=s;});setVideoStatuses(byVid);}catch(e){}};

  /* Loading screen */
  if(cloudLoading)return(
    <div style={{width:"100%",height:"100vh",background:C.base,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Inter',sans-serif"}}>
      <h1 style={{fontSize:48,fontWeight:900,fontStyle:"italic",marginBottom:8}}>
        <span style={{color:"#fff"}}>ATHLETES</span><span style={{color:C.coral}}>USA</span>
      </h1>
      <div style={{display:"flex",gap:4,marginTop:16}}>
        {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:C.blue,animation:`pulse 1.4s ease-in-out ${i*0.2}s infinite`}}/>)}
      </div>
      <div style={{color:C.sub,fontSize:12,marginTop:12}}>Connecting to cloud...</div>
    </div>);

  /* ── OVERLAY TOOL (reachable from ANY screen via state OR hash route) ── */
  if(overlayName!==null||route==="overlay"){
    const name=overlayName||getHashParam();
    return<SpotlightTagGenerator onBack={()=>{setOverlayName(null);if(route==="overlay")goToLanding();}} defaultName={name}/>;
  }

  /* ── INNER SCREENS (athlete flow + editor) ── */
  if(screen==="editor")return<StudioApp players={players} onLogout={goToLanding} onRefreshPlayers={refreshPlayers}/>;
  if(screen==="athlete"){
    if(athleteStep==="select")return<AthleteSelect players={players} isEditorMode={isEditorMode} allBatches={allBatches}
      onSelect={id=>{setActivePlayerId(id);setAthleteStep("portal");}}
      onPhoneLogin={player=>{setMyAthletePhone(player.phone);setMyPlayerId(player.id);setActivePlayerId(player.id);setAthleteStep("portal");}}
      onCreate={()=>setAthleteStep("form")} onBack={goToLanding} onDelete={handleDeletePlayer}/>;
    if(athleteStep==="form")return<AthleteProfileForm onSubmit={handleCreateProfile} onBack={()=>setAthleteStep("select")} existingPlayers={players}/>;
    if(athleteStep==="portal"&&activePlayer)return(<>
      <AthletePortal player={activePlayer} onUpdatePlayer={handleUpdatePlayer}
        isEditorMode={isEditorMode} onBack={isEditorMode?()=>{setAthleteStep("select");setActivePlayerId(null);refreshBatches();}:athleteSignOut}
        onOpenOverlay={(name)=>{setOverlayName(name);}}
        videoStatuses={videoStatuses} onStatusChange={refreshStatuses}
        playerBatches={allBatches[activePlayer.id]||[]} onBatchChange={refreshBatches}/>
      {showOnboarding&&<OnboardingGuide playerName={activePlayer.name} onDone={()=>setShowOnboarding(false)}/>}
    </>);
  }

  /* ── LANDING SCREENS (based on hash route) ── */

  /* #/athlete → Athlete-only entry (NO studio access) */
  if(route==="athlete"){
    return<AthleteLandingPage onEnter={enterAthlete}/>;
  }

  /* #/studio → Studio entry (password-gated, editors CAN also view athlete pages) */
  if(route==="studio"){
    return<StudioLandingPage
      onEnterStudio={enterStudio}
      onEnterAthleteReview={()=>{setStudioAuth(true);enterAthleteAsEditor();}}/>;
  }

  /* Default (no hash or #/) → combined landing with both tiles (backward compat) */
  return<LandingPage onEnterAthlete={enterAthlete} onEnterStudio={enterStudio}/>;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
