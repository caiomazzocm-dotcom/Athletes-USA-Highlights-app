/* ═══ HELPERS ═══ */
const getMediaDur=url=>new Promise(r=>{const v=document.createElement("video");v.preload="metadata";v.muted=true;v.addEventListener("loadedmetadata",()=>{const d=v.duration||10;v.pause();v.removeAttribute("src");v.load();r(d);});v.addEventListener("error",()=>r(10));v.src=url;});
const getAudioDur=url=>new Promise(r=>{const a=new Audio();a.preload="metadata";a.muted=true;a.addEventListener("loadedmetadata",()=>{const d=a.duration||10;a.pause();a.removeAttribute("src");a.load();r(d);});a.addEventListener("error",()=>r(10));a.src=url;});

/* ═══ INDEXED-DB VIDEO STORE ═══ */
const VDB_NAME="aua_videodb";const VDB_VER=1;const VDB_STORE="blobs";
const openVDB=()=>new Promise((res,rej)=>{const rq=indexedDB.open(VDB_NAME,VDB_VER);rq.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(VDB_STORE))db.createObjectStore(VDB_STORE);};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});
const storeBlob=async(id,blob)=>{const db=await openVDB();return new Promise((res,rej)=>{const tx=db.transaction(VDB_STORE,"readwrite");tx.objectStore(VDB_STORE).put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});};
const getBlob=async(id)=>{const db=await openVDB();return new Promise((res,rej)=>{const tx=db.transaction(VDB_STORE,"readonly");const rq=tx.objectStore(VDB_STORE).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});};
const deleteBlob=async(id)=>{const db=await openVDB();return new Promise((res,rej)=>{const tx=db.transaction(VDB_STORE,"readwrite");tx.objectStore(VDB_STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});};
const hydratePlayerVideos=async(players)=>{const out=[];for(const pl of players){const cats=[];for(const cat of pl.categories){const vids=[];for(const v of cat.videos){try{const blob=await getBlob(v.id);if(blob){const url=URL.createObjectURL(blob);vids.push({...v,url});}else{vids.push({...v,url:v.cloudUrl||v.url||""});}}catch(e){vids.push({...v,url:v.cloudUrl||v.url||""});}}cats.push({...cat,videos:vids});}out.push({...pl,categories:cats});}return out;};

const uploadVideoToCloud=async(videoId,blob,onProgress)=>{const ref=fbStorage.ref(`videos/${videoId}`);const task=ref.put(blob);if(onProgress)task.on("state_changed",snap=>onProgress(snap.bytesTransferred/snap.totalBytes));await task;return await ref.getDownloadURL();};
const deleteVideoFromCloud=async(videoId)=>{try{await fbStorage.ref(`videos/${videoId}`).delete();}catch(e){}};
const savePlayerToCloud=async(player)=>{try{const safe={id:player.id,name:player.name,recruitingClass:player.recruitingClass,size:player.size||"",dob:player.dob||"",shirtNumber:player.shirtNumber||"",uniformDesc:player.uniformDesc||"",positions:player.positions||[],profilePicUrl:player.profilePicUrl||"",playingPicUrl:player.playingPicUrl||"",phone:player.phone||"",gameLinks:player.gameLinks||[],extraPhotos:player.extraPhotos||[],categories:player.categories.map(c=>({...c,videos:c.videos.map(v=>({id:v.id,name:v.name,duration:v.duration,cloudUrl:v.cloudUrl||""}))}))};await fbDb.collection("players").doc(player.id).set(safe);}catch(e){console.warn("Cloud save failed:",e);}};
const deletePlayerFromCloud=async(playerId)=>{try{await fbDb.collection("players").doc(playerId).delete();}catch(e){}};
const loadPlayersFromCloud=async()=>{try{const snap=await fbDb.collection("players").get();return snap.docs.map(d=>{const p=d.data();return{...p,categories:(p.categories||[]).map(c=>({...c,videos:(c.videos||[]).map(v=>({...v,url:v.cloudUrl||""}))}))};});}catch(e){console.warn("Cloud load failed:",e);return[];}};

const advanceBatchStage=async(batchId,newStage,editorName)=>{const now=Date.now();try{const ref=fbDb.collection("videoBatches").doc(batchId);const doc=await ref.get();if(!doc.exists)return;const prev=doc.data();const activity=prev.activity||[];activity.push({action:`Moved to ${BATCH_META[newStage].label}`,by:editorName||"Editor",at:now});await ref.update({stage:newStage,editor:editorName||(prev.editor||""),activity,updatedAt:now});}catch(e){console.warn("Batch advance failed:",e);}};
/* Create a new batch when editor downloads videos */
const createBatchFromDownload=async(player,editorName)=>{
  const now=Date.now();const allVids=player.categories.flatMap(c=>c.videos);
  if(allVids.length===0)return null;
  /* Check existing batches to only include NEW (unbatched) videos */
  const existing=await loadBatches(player.id);
  const batchedIds=new Set();existing.forEach(b=>(b.videoIds||[]).forEach(id=>batchedIds.add(id)));
  const newVids=allVids.filter(v=>!batchedIds.has(v.id));
  if(newVids.length===0)return null;/* all videos already in a batch */
  const batch={id:uid("batch"),playerId:player.id,playerName:player.name,videoIds:newVids.map(v=>v.id),videoNames:newVids.map(v=>v.name),videoCount:newVids.length,stage:"editing",editor:editorName||"Editor",createdAt:now,updatedAt:now,downloadedAt:now,activity:[{action:"Videos downloaded by editor",by:editorName||"Editor",at:now},{action:"Editing started",by:editorName||"Editor",at:now}]};
  await saveBatch(batch);
  /* Also mark individual video statuses for backward compatibility */
  for(const v of newVids){await advanceVideoStage(player.id,v.id,"editing",editorName||"Editor");}
  return batch;
};

/* ═══ WAVEFORM ═══ */
const Waveform=({w,h,color,seed=0})=>{
  /* past 400 bars (a long clip zoomed in to frames) the same 400-bar strip repeats
     as an SVG pattern, so the bars keep their size and the page stays light */
  const tiled=w/3>400,bars=tiled?400:Math.max(4,Math.floor(w/3)),tw=tiled?1200:w;const pts=[];let s=seed||1;
  for(let i=0;i<bars;i++){s=(s*16807+i*13)%2147483647;const n=(s%1000)/1000;pts.push(0.2+n*0.8);}
  const rects=pts.map((a,i)=>{const bw=tw/bars;const bh=Math.max(1,a*h);return<rect key={i} x={i*bw} y={(h-bh)/2} width={Math.max(1,bw-1)} height={bh} fill={color} rx={0.5}/>;});
  if(!tiled)return(<svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:"block"}}>{rects}</svg>);
  const pid=`wf${seed}-${h}-${String(color).replace(/[^a-z0-9]/gi,"")}`;
  return(<svg width={w} height={h} style={{display:"block"}}><defs><pattern id={pid} width={tw} height={h} patternUnits="userSpaceOnUse">{rects}</pattern></defs><rect width={w} height={h} fill={`url(#${pid})`}/></svg>);};

/* ═══ DOWNLOAD HELPERS ═══ */
const downloadImage=(url,filename)=>{const a=document.createElement("a");a.href=url;a.download=filename||"image.jpg";a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();document.body.removeChild(a);};

const sanitizeName=(s)=>s.replace(/[^a-zA-Z0-9_\-]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")||"Unnamed";

const downloadPlayerZip=async(player,onProgress)=>{
  if(typeof JSZip==="undefined"){alert("JSZip library not loaded. Please refresh and try again.");return{total:0,downloaded:0,missing:0};}
  const zip=new JSZip();
  const today=new Date().toISOString().slice(0,10);
  const rootName=sanitizeName(player.name)+"_Clips_"+today;
  const root=zip.folder(rootName);
  const missing=[];
  let totalFiles=0;let processed=0;
  player.categories.forEach(cat=>totalFiles+=cat.videos.length);
  if(onProgress)onProgress({phase:"fetching",pct:0,fetched:0,total:totalFiles});
  for(const cat of player.categories){
    const catFolder=root.folder(sanitizeName(cat.name));
    for(const vid of cat.videos){
      const url=vid.cloudUrl||vid.url;
      if(!url){missing.push({id:vid.id,name:vid.name,category:cat.name,reason:"No URL"});processed++;if(onProgress)onProgress({phase:"fetching",pct:Math.round(processed/Math.max(1,totalFiles)*100),fetched:processed,total:totalFiles});continue;}
      try{
        const resp=await fetch(url);
        if(!resp.ok)throw new Error("HTTP "+resp.status);
        const blob=await resp.blob();
        const ext=blob.type.includes("mp4")?"mp4":blob.type.includes("webm")?"webm":blob.type.includes("quicktime")?"mov":"mp4";
        const fname=sanitizeName(cat.name)+"_"+sanitizeName(vid.name)+"_"+vid.id+"."+ext;
        catFolder.file(fname,blob);
      }catch(e){
        missing.push({id:vid.id,name:vid.name,category:cat.name,reason:e.message});
      }
      processed++;
      if(onProgress)onProgress({phase:"fetching",pct:Math.round(processed/Math.max(1,totalFiles)*100),fetched:processed,total:totalFiles});
    }
  }
  if(missing.length>0){
    let txt="MISSING FILES REPORT\nGenerated: "+new Date().toISOString()+"\nAthlete: "+player.name+"\n\n";
    missing.forEach(m=>{txt+="- ["+m.category+"] "+m.name+" (id: "+m.id+") — "+m.reason+"\n";});
    root.file("MISSING_FILES.txt",txt);
  }
  if(onProgress)onProgress({phase:"zipping",pct:0,fetched:processed,total:totalFiles});
  const zipBlob=await zip.generateAsync({type:"blob",compression:"STORE"},meta=>{if(onProgress)onProgress({phase:"zipping",pct:Math.round(meta.percent),fetched:processed,total:totalFiles});});
  const a=document.createElement("a");a.href=URL.createObjectURL(zipBlob);a.download=rootName+".zip";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a);},1000);
  return{total:totalFiles,downloaded:totalFiles-missing.length,missing:missing.length};
};

/* ═══════════ ATHLETE: PROFILE FORM ═══════════ */
function AthleteProfileForm({onSubmit,onBack,existingPlayers}){
  const[name,setName]=useState("");const[rc,setRc]=useState("2026");const[size,setSize]=useState("");const[dob,setDob]=useState("");
  const[shirtNum,setShirtNum]=useState("");const[uniformDesc,setUniformDesc]=useState("");
  const[phone,setPhone]=useState("");const[phoneErr,setPhoneErr]=useState("");
  const ALL_POSITIONS=["GK","LCB","CB","RCB","LB","LWB","RB","RWB","CDM","CM","CAM","LM","RM","LW","RW","ST","CF","SS"];
  const[positions,setPositions]=useState([]);
  const togglePos=p=>setPositions(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);
  const[profilePic,setProfilePic]=useState(null);const[profilePicPrev,setProfilePicPrev]=useState(null);
  const[playingPic,setPlayingPic]=useState(null);const[playingPicPrev,setPlayingPicPrev]=useState(null);
  const[creating,setCreating]=useState(false);const[createProg,setCreateProg]=useState("");
  const profRef=useRef(null);const playRef=useRef(null);

  const cmToFeet=(cm)=>{const totalIn=cm/2.54;const ft=Math.floor(totalIn/12);const inch=Math.round(totalIn%12);return inch===12?`${ft+1}'0"`:`${ft}'${inch}"`;};
  const handleSizeChange=(val)=>{
    const cmMatch=val.match(/^(\d+(?:\.\d+)?)\s*cm$/i);
    if(cmMatch){const cm=parseFloat(cmMatch[1]);if(cm>0&&cm<300){setSize(cmToFeet(cm));return;}}
    setSize(val);
  };
  const onPickProfile=e=>{const f=e.target.files[0];if(!f)return;setProfilePic(f);setProfilePicPrev(URL.createObjectURL(f));};
  const onPickPlaying=e=>{const f=e.target.files[0];if(!f)return;setPlayingPic(f);setPlayingPicPrev(URL.createObjectURL(f));};

  const normalizePhone=p=>p.replace(/[^0-9]/g,"");
  const handlePhoneChange=val=>{
    setPhone(val);setPhoneErr("");
    const digits=normalizePhone(val);
    if(digits.length>=7&&existingPlayers){
      const dup=existingPlayers.find(pl=>normalizePhone(pl.phone||"")===digits);
      if(dup)setPhoneErr("This phone number is already registered to "+dup.name+".");
    }
  };

  const handle=async()=>{if(!canSubmit)return;
    const digits=normalizePhone(phone);
    if(existingPlayers){const dup=existingPlayers.find(pl=>normalizePhone(pl.phone||"")===digits);
      if(dup){setPhoneErr("This phone number is already registered to "+dup.name+".");return;}}
    setCreating(true);
    let profilePicUrl="",playingPicUrl="";
    try{
      if(profilePic){setCreateProg("Uploading profile picture...");const id=uid("ppic");profilePicUrl=await uploadVideoToCloud(id,profilePic,()=>{});}
      if(playingPic){setCreateProg("Uploading playing picture...");const id=uid("apic");playingPicUrl=await uploadVideoToCloud(id,playingPic,()=>{});}
    }catch(e){console.warn("Pic upload failed:",e);}
    setCreateProg("Creating profile...");
    onSubmit({name:name.trim(),recruitingClass:rc,size:size.trim(),dob,shirtNumber:shirtNum.trim(),uniformDesc:uniformDesc.trim(),positions,profilePicUrl,playingPicUrl,phone:digits});
    setCreating(false);
  };

  const canSubmit=name.trim()&&shirtNum.trim()&&rc&&size.trim()&&dob&&positions.length>0&&uniformDesc.trim()&&profilePic&&playingPic&&normalizePhone(phone).length>=7&&!phoneErr&&!creating;
  const labelStyle={color:C.sub,fontSize:12,fontWeight:600,marginBottom:6,display:"block",letterSpacing:1,textTransform:"uppercase"};
  const picBoxStyle=(hasImg)=>({width:"100%",height:140,borderRadius:12,border:`2px dashed ${hasImg?C.blue+"66":C.s1}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",background:hasImg?"transparent":C.s0,overflow:"hidden",position:"relative",transition:"border 0.2s"});
  return(
  <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:C.base,display:"flex",flexDirection:"column",fontFamily:"'Inter',sans-serif",overflow:"hidden"}}>
    <input ref={profRef} type="file" accept="image/*" onChange={onPickProfile} style={{display:"none"}}/>

    <div style={{display:"flex",alignItems:"center",padding:"0 16px",height:48,background:C.mantle,borderBottom:`1px solid ${C.s0}`,flexShrink:0}}>
      <button onClick={onBack} style={{...ib,color:C.sub,marginRight:12}}><ArrowLeftIcon size={18}/></button>
      <div style={{width:1,height:24,background:C.s0,marginRight:14}}/>
      <span style={{fontWeight:900,fontSize:15,color:"#fff",fontStyle:"italic",marginRight:4}}>ATHLETES</span>
      <span style={{fontWeight:900,fontSize:15,color:C.coral,fontStyle:"italic",marginRight:16}}>USA</span>
      <span style={{color:C.sub,fontSize:12}}>New Player Profile</span>
    </div>
    <div className="ath-form-wrap" style={{flex:1,overflow:"auto",WebkitOverflowScrolling:"touch",display:"flex",justifyContent:"center",padding:32}}>
      <div style={{maxWidth:560,width:"100%",animation:"fadeIn 0.5s ease-out"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          {profilePicPrev?<img src={profilePicPrev} style={{width:72,height:72,borderRadius:"50%",objectFit:"cover",border:`3px solid ${C.blue}`,margin:"0 auto 12px",display:"block"}}/>
          :<div style={{width:72,height:72,borderRadius:"50%",background:"linear-gradient(135deg,#3b82f6,#2563eb)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><UserIcon size={30} color="#fff"/></div>}

            <label style={labelStyle}>Phone Number *</label>

            <div>

              <input value={shirtNum} onChange={e=>setShirtNum(e.target.value.replace(/\D/g,"").slice(0,3))} placeholder="e.g. 10" style={inputStyle} maxLength={3}/>
            </div>
            <div>
              <label style={labelStyle}>Recruiting Class *</label>
              <select value={rc} onChange={e=>setRc(e.target.value)} style={{...inputStyle,cursor:"pointer"}}>
                {["2024","2025","2026","2027","2028","2029","2030"].map(y=><option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <div>
              <label style={labelStyle}>Height / Size *</label>
              <input value={size} onChange={e=>handleSizeChange(e.target.value)} placeholder="5'11&quot; or 180cm" style={inputStyle}/>
            </div>
          </div>
          <div>
            <label style={labelStyle}>Positions Played *</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {ALL_POSITIONS.map(p=><button key={p} type="button" onClick={()=>togglePos(p)} style={{padding:"5px 12px",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",border:positions.includes(p)?`2px solid ${C.blue}`:`2px solid ${C.s1}`,background:positions.includes(p)?C.blue+"22":"transparent",color:positions.includes(p)?C.blue:C.sub,transition:"all 0.15s"}}>{p}</button>)}
            </div>
            {positions.length>0&&<div style={{color:C.overlay,fontSize:10,marginTop:6}}>Selected: {positions.join(", ")}</div>}
          </div>
          <div>
            <label style={labelStyle}>Uniform Description *</label>
            <input value={uniformDesc} onChange={e=>setUniformDesc(e.target.value)} placeholder="e.g. White home jersey, blue shorts, #10 on back" style={inputStyle}/>
          </div>
          <div>
            <label style={labelStyle}>Date of Birth *</label>
            <input type="date" value={dob} onChange={e=>setDob(e.target.value)} style={{...inputStyle,colorScheme:"dark"}}/>
          </div>
          <div className="ath-form-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            <div>
              <label style={labelStyle}>Profile Picture *</label>
              <div onClick={()=>profRef.current?.click()} style={picBoxStyle(!!profilePicPrev)}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.blue} onMouseLeave={e=>e.currentTarget.style.borderColor=profilePicPrev?C.blue+"66":C.s1}>
                {profilePicPrev?<img src={profilePicPrev} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                :<><UserIcon size={28} color={C.s2}/><span style={{color:C.overlay,fontSize:10,marginTop:6}}>Click to upload</span><span style={{color:C.s2,fontSize:9}}>Headshot / Portrait</span></>}
              </div>
            </div>
            <div>
              <label style={labelStyle}>Playing Picture *</label>
              <div onClick={()=>playRef.current?.click()} style={picBoxStyle(!!playingPicPrev)}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.coral} onMouseLeave={e=>e.currentTarget.style.borderColor=playingPicPrev?C.coral+"66":C.s1}>
                {playingPicPrev?<img src={playingPicPrev} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                :<><FilmIcon size={28} color={C.s2}/><span style={{color:C.overlay,fontSize:10,marginTop:6}}>Click to upload</span><span style={{color:C.s2,fontSize:9}}>Action / Game Shot</span></>}
              </div>
            </div>
          </div>
          <button onClick={handle} disabled={!canSubmit}
            style={{width:"100%",padding:14,background:canSubmit?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1a1a2e",color:canSubmit?"#fff":"#64748b",
              border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:canSubmit?"pointer":"not-allowed",marginTop:4,letterSpacing:1}}>
            {creating?createProg:"CREATE PROFILE"}
          </button>
        </div>
      </div>
    </div>
  </div>);
}

/* ═══════════ FEEDBACK MODAL ═══════════ */
function FeedbackModal({onClose,playerName}){
  const[fbType,setFbType]=useState("bug");
  const[fbText,setFbText]=useState("");
  const[fbRating,setFbRating]=useState(0);
  const[screenshots,setScreenshots]=useState([]);/* [{file,preview}] */
  const[sending,setSending]=useState(false);
  const[sent,setSent]=useState(false);
  const ssRef=useRef(null);

  const addScreenshots=files=>{
    const newSS=Array.from(files).slice(0,5-screenshots.length).map(f=>({file:f,preview:URL.createObjectURL(f)}));
    setScreenshots(prev=>[...prev,...newSS].slice(0,5));
  };
  const removeScreenshot=idx=>{
    setScreenshots(prev=>{URL.revokeObjectURL(prev[idx].preview);return prev.filter((_,i)=>i!==idx);});
  };

  const handleSubmit=async()=>{
    if(!fbText.trim())return;
    setSending(true);
    try{
      const id=uid("fb");
      const ssUrls=[];
      for(let i=0;i<screenshots.length;i++){
        const url=await uploadFeedbackScreenshot(id,screenshots[i].file,i);
        ssUrls.push(url);
      }
      const feedback={id,type:fbType,message:fbText.trim(),rating:fbRating,screenshots:ssUrls,
        playerName:playerName||"Anonymous",status:"open",adminNote:"",
        createdAt:Date.now(),updatedAt:Date.now()};
      await saveFeedbackToCloud(feedback);
      setSent(true);
      setTimeout(()=>onClose(),1800);
    }catch(e){console.error("Feedback submit error:",e);alert("Failed to submit feedback. Please try again.");setSending(false);}
  };

  const types=[{val:"bug",label:"Bug Report",icon:"🐛"},{val:"feature",label:"Feature Request",icon:"💡"},{val:"general",label:"General Feedback",icon:"💬"},{val:"praise",label:"Praise",icon:"⭐"}];

  if(sent)return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}>
      <div style={{background:C.mantle,borderRadius:20,padding:"48px 40px",textAlign:"center",animation:"fadeIn 0.3s ease-out",maxWidth:380}}>
        <div style={{fontSize:48,marginBottom:12}}>✅</div>
        <div style={{fontSize:18,fontWeight:800,color:"#fff",marginBottom:8}}>Thank You!</div>
        <div style={{color:C.sub,fontSize:13}}>Your feedback has been submitted successfully.</div>
      </div>
    </div>);

  return(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}
    onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:C.mantle,border:`1px solid ${C.s0}`,borderRadius:20,padding:"28px 32px",width:"95%",maxWidth:480,maxHeight:"90vh",overflow:"auto",animation:"fadeIn 0.3s ease-out",boxShadow:"0 20px 80px rgba(0,0,0,0.6)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:C.blue+"22",display:"flex",alignItems:"center",justifyContent:"center"}}><MessageSquareIcon size={18} color={C.blue}/></div>
          <div><div style={{fontWeight:800,fontSize:16,color:"#fff"}}>Send Feedback</div><div style={{color:C.sub,fontSize:11}}>Help us improve AUSA Video Hub</div></div>
        </div>
        <button onClick={onClose} style={{...ib,color:C.overlay}}><XIcon size={18}/></button>
      </div>

      {/* Type selector */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {types.map(t=>(
          <button key={t.val} onClick={()=>setFbType(t.val)}
            style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:fbType===t.val?C.blue+"22":C.s0,
              border:`1px solid ${fbType===t.val?C.blue:C.s1}`,borderRadius:10,cursor:"pointer",color:fbType===t.val?C.blue:C.sub,fontSize:12,fontWeight:600}}>
            <span style={{fontSize:16}}>{t.icon}</span>{t.label}
          </button>))}
      </div>

      {/* Rating (optional) */}
      <div style={{marginBottom:16}}>
        <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:6}}>RATING (OPTIONAL)</div>
        <div style={{display:"flex",gap:4}}>
          {[1,2,3,4,5].map(n=>(
            <button key={n} onClick={()=>setFbRating(fbRating===n?0:n)}
              style={{...ib,color:n<=fbRating?"#eab308":C.s2,transition:"color 0.15s",padding:2}}>
              <StarIcon size={22} color={n<=fbRating?"#eab308":C.s2}/>
            </button>))}
        </div>
      </div>

      {/* Message */}
      <div style={{marginBottom:16}}>
        <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:6}}>YOUR MESSAGE *</div>
        <textarea value={fbText} onChange={e=>setFbText(e.target.value)} placeholder="Describe your feedback, issue, or suggestion..."
          rows={4} style={{...inputStyle,resize:"vertical",minHeight:80,maxHeight:200,fontFamily:"'Inter',sans-serif"}}/>
      </div>

      {/* Screenshots */}
      <div style={{marginBottom:20}}>
        <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:6}}>SCREENSHOTS (UP TO 5)</div>
        <input ref={ssRef} type="file" accept="image/*" multiple onChange={e=>{if(e.target.files.length)addScreenshots(e.target.files);e.target.value="";}} style={{display:"none"}}/>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {screenshots.map((ss,i)=>(
            <div key={i} style={{position:"relative",width:72,height:72,borderRadius:8,overflow:"hidden",border:`1px solid ${C.s1}`}}>
              <img src={ss.preview} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <button onClick={()=>removeScreenshot(i)}
                style={{position:"absolute",top:2,right:2,width:18,height:18,borderRadius:"50%",background:"rgba(0,0,0,0.7)",border:"none",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                <XIcon size={10} color="#fff"/>
              </button>
            </div>))}
          {screenshots.length<5&&(
            <button onClick={()=>ssRef.current&&ssRef.current.click()}
              style={{width:72,height:72,borderRadius:8,border:`1px dashed ${C.s2}`,background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,cursor:"pointer",color:C.overlay}}>
              <ImageIcon size={18} color={C.overlay}/>
              <span style={{fontSize:8,fontWeight:600}}>ADD</span>
            </button>)}
        </div>
      </div>

      {/* Submit */}
      <button onClick={handleSubmit} disabled={!fbText.trim()||sending}
        style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8,
          padding:"12px 24px",background:fbText.trim()&&!sending?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1a1a2e",
          color:fbText.trim()&&!sending?"#fff":"#64748b",border:"none",borderRadius:10,cursor:fbText.trim()&&!sending?"pointer":"not-allowed",
          fontSize:14,fontWeight:700,letterSpacing:0.5}}>
        {sending?<><div style={{display:"flex",gap:3}}>{[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:"#fff",animation:`pulse 1.4s ease-in-out ${i*0.2}s infinite`}}/>)}</div> Submitting...</>
        :<><SendIcon size={15}/> Submit Feedback</>}
      </button>
    </div>
  </div>);
}

/* ═══════════ FEEDBACK ADMIN PANEL ═══════════ */
function FeedbackAdmin({onClose}){
  const[items,setItems]=useState([]);const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState("all");/* all|open|in_progress|resolved */
  const[selectedFb,setSelectedFb]=useState(null);
  const[adminNote,setAdminNote]=useState("");
  const[previewImg,setPreviewImg]=useState(null);

  useEffect(()=>{(async()=>{const fb=await loadFeedbackFromCloud();setItems(fb);setLoading(false);})();},[]);

  const handleStatusChange=async(fb,newStatus)=>{
    await updateFeedbackStatus(fb.id,newStatus,fb.adminNote||"");
    setItems(prev=>prev.map(f=>f.id===fb.id?{...f,status:newStatus,updatedAt:Date.now()}:f));
  };
  const handleAddNote=async(fb)=>{
    if(!adminNote.trim())return;
    await updateFeedbackStatus(fb.id,fb.status,adminNote.trim());
    setItems(prev=>prev.map(f=>f.id===fb.id?{...f,adminNote:adminNote.trim(),updatedAt:Date.now()}:f));
    setAdminNote("");
  };
  const handleDelete=async(fb)=>{
    if(!confirm("Delete this feedback permanently?"))return;
    await deleteFeedbackFromCloud(fb.id);
    setItems(prev=>prev.filter(f=>f.id!==fb.id));
    if(selectedFb&&selectedFb.id===fb.id)setSelectedFb(null);
  };

  const filtered=filter==="all"?items:items.filter(f=>f.status===filter);
  const statusColors={open:C.blue,in_progress:"#eab308",resolved:C.green,closed:C.overlay};
  const statusLabels={open:"Open",in_progress:"In Progress",resolved:"Resolved",closed:"Closed"};
  const typeEmojis={bug:"🐛",feature:"💡",general:"💬",praise:"⭐"};

  const fmtDate=ts=>{if(!ts)return"—";const d=new Date(ts);return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});};

  return(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",backdropFilter:"blur(12px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}>
    <div style={{background:C.base,border:`1px solid ${C.s0}`,borderRadius:20,width:"95%",maxWidth:900,height:"85vh",display:"flex",flexDirection:"column",overflow:"hidden",animation:"fadeIn 0.3s ease-out",boxShadow:"0 20px 80px rgba(0,0,0,0.6)"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"20px 24px",borderBottom:`1px solid ${C.s0}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <MessageSquareIcon size={20} color={C.blue}/>
          <span style={{fontWeight:800,fontSize:18,color:"#fff"}}>Feedback Manager</span>
          <span style={{background:C.blue+"22",color:C.blue,fontSize:11,fontWeight:700,padding:"2px 10px",borderRadius:12}}>{items.length}</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {["all","open","in_progress","resolved"].map(f=>(
            <button key={f} onClick={()=>setFilter(f)}
              style={{padding:"5px 12px",borderRadius:6,border:`1px solid ${filter===f?C.blue:C.s1}`,background:filter===f?C.blue+"22":"transparent",
                color:filter===f?C.blue:C.sub,cursor:"pointer",fontSize:11,fontWeight:600,textTransform:"capitalize"}}>
              {f==="all"?"All":statusLabels[f]||f}
            </button>))}
          <button onClick={onClose} style={{...ib,color:C.overlay,marginLeft:8}}><XIcon size={18}/></button>
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* List */}
        <div style={{width:selectedFb?"45%":"100%",borderRight:selectedFb?`1px solid ${C.s0}`:"none",overflow:"auto",transition:"width 0.2s"}}>
          {loading?<div style={{padding:40,textAlign:"center",color:C.sub}}>Loading feedback...</div>
          :filtered.length===0?<div style={{padding:40,textAlign:"center",color:C.sub}}>No feedback found.</div>
          :filtered.map(fb=>(
            <div key={fb.id} onClick={()=>{setSelectedFb(fb);setAdminNote(fb.adminNote||"");}}
              style={{padding:"14px 20px",borderBottom:`1px solid ${C.s0}08`,cursor:"pointer",
                background:selectedFb&&selectedFb.id===fb.id?C.s0+"66":"transparent",transition:"background 0.15s"}}
              onMouseEnter={e=>{if(!selectedFb||selectedFb.id!==fb.id)e.currentTarget.style.background=C.s0+"33";}}
              onMouseLeave={e=>{if(!selectedFb||selectedFb.id!==fb.id)e.currentTarget.style.background="transparent";}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <span style={{fontSize:14}}>{typeEmojis[fb.type]||"💬"}</span>
                <span style={{color:"#fff",fontSize:13,fontWeight:700,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {fb.message.length>60?fb.message.slice(0,60)+"...":fb.message}
                </span>
                <span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:4,
                  background:(statusColors[fb.status]||C.overlay)+"22",color:statusColors[fb.status]||C.overlay,textTransform:"uppercase",letterSpacing:0.5}}>
                  {statusLabels[fb.status]||fb.status}
                </span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12,color:C.overlay,fontSize:10}}>
                <span><UserIcon size={10}/> {fb.playerName}</span>
                <span><ClockIcon size={10}/> {fmtDate(fb.createdAt)}</span>
                {fb.screenshots&&fb.screenshots.length>0&&<span><ImageIcon size={10}/> {fb.screenshots.length} screenshot{fb.screenshots.length>1?"s":""}</span>}
                {fb.rating>0&&<span style={{color:"#eab308"}}>{"★".repeat(fb.rating)}</span>}
              </div>
            </div>))}
        </div>

        {/* Detail */}
        {selectedFb&&(
          <div style={{flex:1,overflow:"auto",padding:24}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
              <span style={{fontSize:24}}>{typeEmojis[selectedFb.type]||"💬"}</span>
              <div style={{flex:1}}>
                <div style={{color:"#fff",fontSize:15,fontWeight:700}}>{selectedFb.type==="bug"?"Bug Report":selectedFb.type==="feature"?"Feature Request":selectedFb.type==="praise"?"Praise":"General Feedback"}</div>
                <div style={{color:C.overlay,fontSize:11}}>by {selectedFb.playerName} &bull; {fmtDate(selectedFb.createdAt)}</div>
              </div>
              <button onClick={()=>handleDelete(selectedFb)} style={{...ib,color:C.red}} title="Delete"><XIcon size={16}/></button>
            </div>

            {selectedFb.rating>0&&(
              <div style={{display:"flex",gap:2,marginBottom:12}}>
                {[1,2,3,4,5].map(n=><StarIcon key={n} size={16} color={n<=selectedFb.rating?"#eab308":C.s2}/>)}
              </div>)}

            <div style={{background:C.s0,borderRadius:12,padding:"16px 18px",marginBottom:16,color:C.text,fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{selectedFb.message}</div>

            {selectedFb.screenshots&&selectedFb.screenshots.length>0&&(
              <div style={{marginBottom:16}}>
                <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:8}}>SCREENSHOTS</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {selectedFb.screenshots.map((url,i)=>(
                    <img key={i} src={url} onClick={()=>setPreviewImg(url)}
                      style={{width:100,height:75,objectFit:"cover",borderRadius:8,border:`1px solid ${C.s1}`,cursor:"pointer",transition:"transform 0.15s"}}
                      onMouseEnter={e=>e.currentTarget.style.transform="scale(1.05)"}
                      onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}/>))}
                </div>
              </div>)}

            {/* Status change */}
            <div style={{marginBottom:16}}>
              <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:8}}>STATUS</div>
              <div style={{display:"flex",gap:6}}>
                {["open","in_progress","resolved","closed"].map(s=>(
                  <button key={s} onClick={()=>handleStatusChange(selectedFb,s)}
                    style={{padding:"6px 14px",borderRadius:6,
                      border:`1px solid ${selectedFb.status===s?(statusColors[s]||C.overlay):C.s1}`,
                      background:selectedFb.status===s?(statusColors[s]||C.overlay)+"22":"transparent",
                      color:selectedFb.status===s?(statusColors[s]||C.overlay):C.sub,cursor:"pointer",fontSize:11,fontWeight:600}}>
                    {statusLabels[s]||s}
                  </button>))}
              </div>
            </div>

            {/* Admin note */}
            <div>
              <div style={{color:C.sub,fontSize:11,fontWeight:600,marginBottom:6}}>ADMIN NOTE</div>
              <div style={{display:"flex",gap:8}}>
                <input value={adminNote} onChange={e=>setAdminNote(e.target.value)}
                  placeholder="Add an internal note..." onKeyDown={e=>{if(e.key==="Enter")handleAddNote(selectedFb);}}
                  style={{...inputStyle,flex:1,fontSize:12}}/>
                <button onClick={()=>handleAddNote(selectedFb)}
                  style={{...tb,background:C.green+"22",border:`1px solid ${C.green}44`,color:C.green,fontSize:11,padding:"8px 16px",whiteSpace:"nowrap"}}>
                  <CheckIcon size={12}/> Save
                </button>
              </div>
              {selectedFb.adminNote&&<div style={{marginTop:8,padding:"8px 12px",background:C.s0,borderRadius:8,color:C.sub,fontSize:11,fontStyle:"italic"}}>{selectedFb.adminNote}</div>}
            </div>
          </div>)}
      </div>
    </div>

    {/* Full-size screenshot preview */}
    {previewImg&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10000,cursor:"pointer"}}
        onClick={()=>setPreviewImg(null)}>
        <img src={previewImg} style={{maxWidth:"90%",maxHeight:"90%",borderRadius:12,boxShadow:"0 0 60px rgba(0,0,0,0.5)"}}/>
      </div>)}
  </div>);
}

    }
  ];
  const s=steps[step];
  const isLast=step===steps.length-1;
  return(
    <div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.75)",backdropFilter:"blur(6px)",fontFamily:"'Inter',sans-serif",animation:"fadeIn 0.3s ease"}}>
      <div style={{background:C.mantle,borderRadius:20,border:`1px solid ${C.s1}`,maxWidth:420,width:"90%",overflow:"hidden",boxShadow:"0 24px 64px rgba(0,0,0,0.6)"}}>
        {/* Header */}
        <div style={{background:`linear-gradient(135deg,${C.blue}18,${C.coral}18)`,padding:"28px 28px 20px",textAlign:"center"}}>
          <div style={{fontSize:13,fontWeight:700,color:C.blue,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>Welcome{playerName?", "+playerName.split(" ")[0]:""}!</div>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>Quick Tour of Your Portal</div>
          <div style={{fontSize:12,color:C.overlay,marginTop:4}}>3 simple steps to get you started</div>
        </div>

        {/* Step content */}
        <div style={{padding:"28px 28px 20px",textAlign:"center"}}>
          <div style={{width:72,height:72,borderRadius:"50%",background:s.color+"18",border:`2px solid ${s.color}33`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>
            {s.icon()}
          </div>
          <div style={{fontSize:17,fontWeight:700,color:"#fff",marginBottom:8}}>{s.title}</div>
          <div style={{fontSize:13,color:C.sub,lineHeight:1.6,maxWidth:340,margin:"0 auto"}}>{s.desc}</div>
        </div>

        {/* Step dots + buttons */}
        <div style={{padding:"8px 28px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",gap:8}}>
            {steps.map((_,i)=>(
              <div key={i} onClick={()=>setStep(i)} style={{width:i===step?24:8,height:8,borderRadius:4,background:i===step?s.color:C.s2,cursor:"pointer",transition:"all 0.3s"}}/>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            {step>0&&<button onClick={()=>setStep(step-1)}
              style={{background:"transparent",border:`1px solid ${C.s1}`,borderRadius:10,padding:"10px 18px",color:C.sub,cursor:"pointer",fontSize:13,fontWeight:600}}>
              Back</button>}
            <button onClick={()=>{if(isLast)onDone();else setStep(step+1);}}
              style={{background:isLast?`linear-gradient(135deg,${C.blue},${C.coral})`:C.blue,border:"none",borderRadius:10,padding:"10px 22px",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:700,letterSpacing:0.3}}>
              {isLast?"Get Started":"Next"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════ EDIT PROFILE MODAL ═══════════ */
function EditProfileModal({player,onSave,onClose}){
  const[name,setName]=useState(player.name||"");
  const[rc,setRc]=useState(player.recruitingClass||"2026");
  const[size,setSize]=useState(player.size||"");
  const[dob,setDob]=useState(player.dob||"");
  const[shirtNum,setShirtNum]=useState(player.shirtNumber||"");
  const[uniformDesc,setUniformDesc]=useState(player.uniformDesc||"");
  const[phone,setPhone]=useState(player.phone||"");
  const ALL_POSITIONS=["GK","LCB","CB","RCB","LB","LWB","RB","RWB","CDM","CM","CAM","LM","RM","LW","RW","ST","CF","SS"];
  const[positions,setPositions]=useState(player.positions||[]);
  const togglePos=p=>setPositions(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);
  const[profilePic,setProfilePic]=useState(null);const[profilePicPrev,setProfilePicPrev]=useState(player.profilePicUrl||null);
  const[playingPic,setPlayingPic]=useState(null);const[playingPicPrev,setPlayingPicPrev]=useState(player.playingPicUrl||null);
  const[saving,setSaving]=useState(false);
  const profRef=useRef(null);const playRef=useRef(null);

  const cmToFeet=(cm)=>{const totalIn=cm/2.54;const ft=Math.floor(totalIn/12);const inch=Math.round(totalIn%12);return inch===12?`${ft+1}'0"`:`${ft}'${inch}"`;};
  const handleSizeChange=(val)=>{
    const cmMatch=val.match(/^(\d+(?:\.\d+)?)\s*cm$/i);
    if(cmMatch){const cm=parseFloat(cmMatch[1]);if(cm>0&&cm<300){setSize(cmToFeet(cm));return;}}
    setSize(val);
  };

  const handleSave=async()=>{
    if(!name.trim())return;
    setSaving(true);
    try{
      let profilePicUrl=player.profilePicUrl||"";
      let playingPicUrl=player.playingPicUrl||"";
      if(profilePic){
        const id=uid("profpic");
        const ref=fbStorage.ref(`profile_pics/${id}`);
        await ref.put(profilePic);
        profilePicUrl=await ref.getDownloadURL();
      }
      if(playingPic){
        const id=uid("playpic");
        const ref=fbStorage.ref(`playing_pics/${id}`);
        await ref.put(playingPic);
        playingPicUrl=await ref.getDownloadURL();
      }
      const updated={...player,name:name.trim(),recruitingClass:rc,size,dob,shirtNumber:shirtNum.trim(),
        uniformDesc:uniformDesc.trim(),positions,profilePicUrl,playingPicUrl,phone:phone.replace(/[^0-9]/g,"")};
      onSave(updated);
      savePlayerToCloud(updated);
      onClose();
    }catch(e){console.error("Save error:",e);alert("Failed to save changes.");setSaving(false);}
  };

  const canSave=name.trim()&&rc&&!saving;
  const labelStyle={color:C.sub,fontSize:11,fontWeight:600,marginBottom:4,display:"block",letterSpacing:0.5};

  return(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}
    onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:C.mantle,border:`1px solid ${C.s0}`,borderRadius:20,padding:"28px 32px",width:"95%",maxWidth:520,maxHeight:"90vh",overflow:"auto",animation:"fadeIn 0.3s ease-out",boxShadow:"0 20px 80px rgba(0,0,0,0.6)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:C.blue+"22",display:"flex",alignItems:"center",justifyContent:"center"}}><Edit3Icon size={18} color={C.blue}/></div>
          <div><div style={{fontWeight:800,fontSize:16,color:"#fff"}}>Edit Profile</div><div style={{color:C.sub,fontSize:11}}>Update your information</div></div>
        </div>
        <button onClick={onClose} style={{...ib,color:C.overlay}}><XIcon size={18}/></button>
      </div>

      <div style={{marginBottom:12}}>
        <label style={labelStyle}>PHONE NUMBER</label>
        <input value={phone} onChange={e=>setPhone(e.target.value)} type="tel" style={{...inputStyle,background:C.s0+"88",color:C.overlay}} disabled/>
        <div style={{color:C.overlay,fontSize:9,marginTop:3}}>Phone number cannot be changed (used for login)</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={labelStyle}>FULL NAME *</label><input value={name} onChange={e=>setName(e.target.value)} style={inputStyle}/></div>
        <div><label style={labelStyle}>SHIRT NUMBER *</label><input value={shirtNum} onChange={e=>setShirtNum(e.target.value)} style={inputStyle}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={labelStyle}>RECRUITING CLASS *</label>
          <select value={rc} onChange={e=>setRc(e.target.value)} style={{...inputStyle,cursor:"pointer"}}>
            {["2025","2026","2027","2028","2029","2030"].map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
        <div><label style={labelStyle}>HEIGHT *</label><input value={size} onChange={e=>handleSizeChange(e.target.value)} placeholder="5'11&quot; or 180cm" style={inputStyle}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div><label style={labelStyle}>DATE OF BIRTH *</label><input type="date" value={dob} onChange={e=>setDob(e.target.value)} style={{...inputStyle,cursor:"pointer"}}/></div>
        <div><label style={labelStyle}>UNIFORM DESCRIPTION *</label><input value={uniformDesc} onChange={e=>setUniformDesc(e.target.value)} placeholder="e.g. Red jersey #10" style={inputStyle}/></div>
      </div>

      <div style={{marginBottom:12}}>
        <label style={labelStyle}>POSITIONS *</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {ALL_POSITIONS.map(p=>(
            <button key={p} onClick={()=>togglePos(p)}
              style={{padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",
                border:`1px solid ${positions.includes(p)?C.green:C.s1}`,
                background:positions.includes(p)?C.green+"22":"transparent",
                color:positions.includes(p)?C.green:C.sub}}>
              {p}
            </button>))}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        <div>
          <label style={labelStyle}>PROFILE PHOTO</label>
          <input ref={profRef} type="file" accept="image/*" onChange={e=>{if(e.target.files[0]){setProfilePic(e.target.files[0]);setProfilePicPrev(URL.createObjectURL(e.target.files[0]));}}} style={{display:"none"}}/>
          <div onClick={()=>profRef.current&&profRef.current.click()}
            style={{height:80,borderRadius:10,border:`1px dashed ${C.s2}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",background:C.s0}}>
            {profilePicPrev?<img src={profilePicPrev} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            :<span style={{color:C.overlay,fontSize:11}}>Click to change</span>}
          </div>
        </div>
        <div>
          <label style={labelStyle}>ACTION PHOTO</label>
          <input ref={playRef} type="file" accept="image/*" onChange={e=>{if(e.target.files[0]){setPlayingPic(e.target.files[0]);setPlayingPicPrev(URL.createObjectURL(e.target.files[0]));}}} style={{display:"none"}}/>
          <div onClick={()=>playRef.current&&playRef.current.click()}
            style={{height:80,borderRadius:10,border:`1px dashed ${C.s2}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",background:C.s0}}>
            {playingPicPrev?<img src={playingPicPrev} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            :<span style={{color:C.overlay,fontSize:11}}>Click to change</span>}
          </div>
        </div>
      </div>

      <button onClick={handleSave} disabled={!canSave}
        style={{width:"100%",padding:12,background:canSave?"linear-gradient(135deg,#3b82f6,#2563eb)":"#1a1a2e",
          color:canSave?"#fff":"#64748b",border:"none",borderRadius:10,fontSize:14,fontWeight:700,
          cursor:canSave?"pointer":"not-allowed",letterSpacing:0.5}}>
        {saving?"Saving...":"Save Changes"}
      </button>
    </div>
  </div>);
}

/* ═══════════ ATHLETE: UPLOAD PORTAL ═══════════ */
function AthletePortal({player,onUpdatePlayer,onBack,isEditorMode,onOpenOverlay,videoStatuses,onStatusChange,playerBatches,onBatchChange}){
  const[editCat,setEditCat]=useState(null);const[editName,setEditName]=useState("");
  const[showPipeline,setShowPipeline]=useState(false);const[expandedVid,setExpandedVid]=useState(null);
  const[showAdd,setShowAdd]=useState(false);const[newCat,setNewCat]=useState("");
  const[showAddLink,setShowAddLink]=useState(false);const[newLinkUrl,setNewLinkUrl]=useState("");const[newLinkTitle,setNewLinkTitle]=useState("");const[newLinkNotes,setNewLinkNotes]=useState("");
  const[mobileTab,setMobileTab]=useState("videos"); /* "videos"|"journey"|"links"|"profile" */
  const[isMobile,setIsMobile]=useState(window.innerWidth<=640);
  useEffect(()=>{const h=()=>setIsMobile(window.innerWidth<=640);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  const[uploadCat,setUploadCat]=useState(null);const fileRef=useRef(null);
  const[dragIdx,setDragIdx]=useState(null);const[overIdx,setOverIdx]=useState(null);
  const[dragVid,setDragVid]=useState(null);const[dragVidCatId,setDragVidCatId]=useState(null);const[dropTargetCat,setDropTargetCat]=useState(null);
  const[moveVidMenu,setMoveVidMenu]=useState(null); /* {vidId,catId} — which video's "move to" menu is open */
  const moveVidToCat=(vid,fromCatId,toCatId)=>{if(fromCatId===toCatId)return;const updated={...player,categories:player.categories.map(c=>{if(c.id===fromCatId)return{...c,videos:c.videos.filter(v=>v.id!==vid.id)};if(c.id===toCatId)return{...c,videos:[...c.videos,vid]};return c;})};onUpdatePlayer(updated);savePlayerToCloud(updated);setMoveVidMenu(null);};
  const[uploadProg,setUploadProg]=useState(null);
  const[zipProg,setZipProg]=useState(null);
  const[showEditProfile,setShowEditProfile]=useState(false);
  const[showWelcome,setShowWelcome]=useState(false);
  const[tourStep,setTourStep]=useState(null); /* null=off, 0=intro, 1-5=steps */
  const[spotRect,setSpotRect]=useState(null);

  const TOUR_STEPS=isMobile?[
    {target:"tour-inbox",tab:"videos",title:"Upload Your Videos",desc:"This is your upload zone. Tap the red upload button to add your game videos here — everything starts in the Media Inbox.",icon:<InboxIcon size={20} color={AUSA.light}/>,color:AUSA.light},
    {target:"tour-categories",tab:"videos",title:"Move Videos to Categories",desc:"Once uploaded, tap any video to expand it — you'll see category buttons appear below (Goals, Assists, etc.). Just tap the category and the video moves there instantly!",icon:<FolderIcon size={20} color={AUSA.blue}/>,color:AUSA.blue},
    {target:"tour-add-cat",tab:"videos",title:"Create Categories",desc:"Need a new category? Tap here to create one. You can rename categories with the edit icon, and reorder them with the arrow buttons.",icon:<FolderIcon size={20} color={AUSA.light}/>,color:AUSA.light},
    {target:"tour-nav-bar",tab:"videos",title:"Navigate Your Portal",desc:"Use these tabs at the bottom to switch between sections — Videos for your uploads, Journey to track progress, Links to share game footage, and Profile to manage your info.",icon:<EyeIcon size={20} color="#a78bfa"/>,color:"#a78bfa"},
    {target:"tour-links-section",tab:"links",title:"Add Game Links",desc:"Share your game footage links here — paste a YouTube, Wyscout, Hudl, or any video URL. Add a title and notes so the editors know exactly what to look for.",icon:<LinkIcon size={20} color={AUSA.red}/>,color:AUSA.red},
    {target:"tour-edit-profile",tab:"profile",title:"Your Profile",desc:"Update your profile photo, positions, shirt number, size, and more. You can also upload extra photos here for the editors to use in your highlights.",icon:<Edit3Icon size={20} color={AUSA.blue}/>,color:AUSA.blue},
    {target:"tour-journey",tab:"journey",title:"Track Your Progress",desc:"Once you've submitted videos, check their status here — see what stage they're in, who's editing them, and estimated timelines for your highlight reel.",icon:<EyeIcon size={20} color="#22c55e"/>,color:"#22c55e"}
  ]:[
    {target:"tour-inbox",tab:"videos",title:"Upload Your Videos",desc:"This is your upload zone. Click the upload button to add your game videos here — everything starts in the Media Inbox.",icon:<InboxIcon size={20} color={AUSA.light}/>,color:AUSA.light},
    {target:"tour-categories",tab:"videos",title:"Drag & Drop to Categories",desc:"After uploading, drag any video from the inbox and drop it into the correct category — Goals, Assists, Defensive Actions, etc.",icon:<FolderIcon size={20} color={AUSA.blue}/>,color:AUSA.blue},
    {target:"tour-add-cat",tab:"videos",title:"Create Categories",desc:"Need a new category? Click here to create one. You can rename categories by clicking the edit icon, and reorder them by dragging.",icon:<FolderIcon size={20} color={AUSA.light}/>,color:AUSA.light},
    {target:"tour-links-section",tab:"links",title:"Add Game Links",desc:"Share your game footage links here — paste a YouTube, Wyscout, or any other video URL. You can also add notes for each link so the editors know what to look for.",icon:<LinkIcon size={20} color={AUSA.red}/>,color:AUSA.red},
    {target:"tour-edit-profile",tab:"profile",title:"Edit Your Profile",desc:"Update your profile photo, positions, shirt number, size, and more. You can also upload extra photos here for the editors to use in your highlights.",icon:<Edit3Icon size={20} color={AUSA.blue}/>,color:AUSA.blue},
    {target:"tour-journey",tab:"journey",title:"Track Your Progress",desc:"Check the status of your highlight videos here — see what stage they're in, who's editing them, and estimated timelines.",icon:<EyeIcon size={20} color="#22c55e"/>,color:"#22c55e"}
  ];

  /* Position spotlight on current tour target — switch tab first on mobile */
  useEffect(()=>{
    if(tourStep===null||tourStep===0){setSpotRect(null);return;}
    const step=TOUR_STEPS[tourStep-1];if(!step)return;
    /* Switch to the right tab on mobile before looking for the element */
    if(isMobile&&step.tab){setMobileTab(step.tab);}
    /* Small delay to let tab switch render, then find the element */
    const timer=setTimeout(()=>{
      const el=document.querySelector(`[data-tour="${step.target}"]`);
      if(el){const r=el.getBoundingClientRect();setSpotRect({x:r.x-8,y:r.y-8,w:r.width+16,h:r.height+16});
        el.scrollIntoView({behavior:"smooth",block:"center",inline:"nearest"});
        /* Re-measure after scroll settles */
        setTimeout(()=>{const r2=el.getBoundingClientRect();setSpotRect({x:r2.x-8,y:r2.y-8,w:r2.width+16,h:r2.height+16});},350);
      }else{setSpotRect(null);}
    },isMobile?150:50);
    return()=>clearTimeout(timer);
  },[tourStep]);

  const startTour=()=>{setShowWelcome(false);setTourStep(1);};
  const nextTourStep=()=>{if(tourStep>=TOUR_STEPS.length){setTourStep(null);setSpotRect(null);if(isMobile)setMobileTab("videos");}else setTourStep(tourStep+1);};
  const skipTour=()=>{setTourStep(null);setSpotRect(null);if(isMobile)setMobileTab("videos");};

  /* ── Show welcome guide on first visit ── */
  useEffect(()=>{
    const key="ausa_welcome_seen_"+player.id;
    if(!localStorage.getItem(key)){setShowWelcome(true);localStorage.setItem(key,"1");}
  },[]);

  /* ── Ensure Media Inbox always exists as first category ── */
  useEffect(()=>{
    const hasInbox=player.categories.some(c=>c.isInbox);
    if(!hasInbox){
      const inbox={id:uid("cat"),name:"Media Inbox",isInbox:true,videos:[]};
      const updated={...player,categories:[inbox,...player.categories]};
      onUpdatePlayer(updated);savePlayerToCloud(updated);
    }else if(!player.categories[0].isInbox){
      const idx=player.categories.findIndex(c=>c.isInbox);
      const cats=[...player.categories];const[inbox]=cats.splice(idx,1);cats.unshift(inbox);
      const updated={...player,categories:cats};onUpdatePlayer(updated);savePlayerToCloud(updated);
    }
  },[]);

  /* ── Video drag handlers (real mouse-following drag) ── */
  const handleVidDragStart=(e,vid,catId)=>{
    setDragVid(vid);setDragVidCatId(catId);
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain",vid.id);
    /* Custom drag ghost — a styled pill that follows the mouse */
    const ghost=document.createElement("div");
    ghost.textContent=vid.name;
    ghost.style.cssText="position:fixed;top:-999px;left:-999px;background:#004990;color:#fff;font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;font-family:Inter,sans-serif;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 20px rgba(0,73,144,0.5);z-index:9999;pointer-events:none;";
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost,100,16);
    setTimeout(()=>document.body.removeChild(ghost),0);
  };
  const handleVidDragEnd=()=>{setDragVid(null);setDragVidCatId(null);setDropTargetCat(null);};
  const handleCatVidDragOver=(e,catId)=>{if(!dragVid)return;e.preventDefault();setDropTargetCat(catId);};
  const handleCatVidDragLeave=(e,catId)=>{if(dropTargetCat===catId)setDropTargetCat(null);};
  const handleCatVidDrop=(e,targetCatId)=>{e.preventDefault();
    if(!dragVid||!dragVidCatId||dragVidCatId===targetCatId){setDragVid(null);setDragVidCatId(null);setDropTargetCat(null);return;}
    const updated={...player,categories:player.categories.map(c=>{
      if(c.id===dragVidCatId)return{...c,videos:c.videos.filter(v=>v.id!==dragVid.id)};
      if(c.id===targetCatId)return{...c,videos:[...c.videos,dragVid]};
      return c;
    })};
    onUpdatePlayer(updated);savePlayerToCloud(updated);
    setDragVid(null);setDragVidCatId(null);setDropTargetCat(null);
  };

  const handleZipDownload=async()=>{
    const totalClips=player.categories.reduce((s,c)=>s+c.videos.length,0);
    if(totalClips===0&&!confirm("This athlete has no clips. Download zip with empty category folders?"))return;
    setZipProg({phase:"fetching",pct:0,fetched:0,total:totalClips});
    try{
      const result=await downloadPlayerZip(player,setZipProg);
      setZipProg(null);
      /* Auto-create batch & mark videos as editing when editor downloads */
      if(isEditorMode){
        await createBatchFromDownload(player,"Editor");
        if(onStatusChange)onStatusChange();
        if(onBatchChange)onBatchChange();
      }
      if(result.missing>0)alert("Download complete. "+result.downloaded+"/"+result.total+" clips downloaded. "+result.missing+" file(s) missing — see MISSING_FILES.txt in the zip.");
    }catch(e){console.error("Zip error:",e);setZipProg(null);alert("Zip download failed: "+e.message);}
  };

  const handleUpload=async(catId,files)=>{
    const vids=[];
    for(let i=0;i<files.length;i++){const f=files[i];const id=uid("vid");const url=URL.createObjectURL(f);const dur=await getMediaDur(url);
      setUploadProg({cur:i+1,total:files.length,pct:0,name:f.name});
      let cloudUrl="";
      try{cloudUrl=await uploadVideoToCloud(id,f,pct=>setUploadProg(p=>({...p,pct})));}catch(e){console.warn("Cloud upload failed:",e);}
      await storeBlob(id,f);
      vids.push({id,name:f.name.replace(/\.[^.]+$/,""),url,duration:dur,cloudUrl});}
    setUploadProg(null);
    const updated={...player,categories:player.categories.map(c=>c.id===catId?{...c,videos:[...c.videos,...vids]}:c)};
    onUpdatePlayer(updated);
    savePlayerToCloud(updated);
    /* Auto-create "submitted" status for each uploaded video */
    for(const v of vids){
      const now=Date.now();
      saveVideoStatus(player.id,v.id,{playerId:player.id,videoId:v.id,videoName:v.name,stage:"submitted",editor:"",activity:[{action:"Video submitted",by:player.name,at:now}],createdAt:now,updatedAt:now});
    }
    if(onStatusChange)onStatusChange();
  };
  const trigUpload=catId=>{setUploadCat(catId);if(fileRef.current){fileRef.current.value="";fileRef.current.click();}};
  const onFile=e=>{if(uploadCat&&e.target.files.length>0)handleUpload(uploadCat,Array.from(e.target.files));};

/* ═══════════ SPOTLIGHT TAG GENERATOR (PNG Overlay Tool) ═══════════ */
function SpotlightTagGenerator({onBack,defaultName}){
  /* ── State: controls ── */
  const[playerName,setPlayerName]=useState(defaultName||"PLAYER NAME");
  const[borderW,setBorderW]=useState(2);
  const[glowIntensity,setGlowIntensity]=useState(15);
  const[nameFontSize,setNameFontSize]=useState(11);
  const[dimOpacity,setDimOpacity]=useState(0.6);
  const[accentColor,setAccentColor]=useState("#2E6FD6");
  const[nameBgColor,setNameBgColor]=useState("#111111");
  const[res,setRes]=useState("4k"); /* "1080p" | "4k" */

  /* ── State: preview ── */
  const[bgImage,setBgImage]=useState(null);
  const[circlePos,setCirclePos]=useState({x:50,y:45}); /* % of preview */
  const[circleRadius,setCircleRadius]=useState(5); /* % of min(W,H) */
  const[dragging,setDragging]=useState(false);
  const[resizing,setResizing]=useState(false);

  const canvasRef=useRef(null);
  const previewRef=useRef(null);
  const bgRef=useRef(null);

  const exportW=res==="4k"?3840:1920;
  const exportH=res==="4k"?2160:1080;

  /* ── Draw live preview ── */
  useEffect(()=>{
    const cvs=canvasRef.current;if(!cvs)return;
    const ctx=cvs.getContext("2d");
    const w=cvs.width,h=cvs.height;
    ctx.clearRect(0,0,w,h);

    /* Background image or dark fill */
    if(bgImage&&bgRef.current&&bgRef.current.complete){
      const img=bgRef.current;
      const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);
      const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;
      ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    }else{
      ctx.fillStyle="#0a0a14";ctx.fillRect(0,0,w,h);
      /* Grid pattern */
      ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
      for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
      for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    }

    /* Circle center & radius in pixels */
    const cx=circlePos.x/100*w;
    const cy=circlePos.y/100*h;
    const r=circleRadius/100*Math.min(w,h);

    /* Dimmer overlay with cutout (evenodd for preview — fast) */
    ctx.fillStyle=`rgba(0,0,0,${dimOpacity})`;
    ctx.beginPath();ctx.rect(0,0,w,h);
    ctx.moveTo(cx+r,cy);ctx.arc(cx,cy,r,0,Math.PI*2,true);
    ctx.fill("evenodd");

    /* Glow rings */
    for(let i=1;i<=glowIntensity;i++){
      const alpha=Math.max(0,0.3*(1-i/glowIntensity));
      ctx.beginPath();ctx.arc(cx,cy,r+i*0.8,0,Math.PI*2);
      ctx.strokeStyle=accentColor+Math.round(alpha*255).toString(16).padStart(2,"0");
      ctx.lineWidth=1.5;ctx.stroke();
    }

    /* Circle border */
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=accentColor;ctx.lineWidth=borderW;
    ctx.shadowColor=accentColor+"88";ctx.shadowBlur=12;
    ctx.stroke();ctx.shadowBlur=0;

    /* Player name tag */
    const fSize=nameFontSize;
    ctx.font=`800 ${fSize}px Inter,Segoe UI,sans-serif`;
    ctx.textAlign="center";
    const txt=playerName.toUpperCase();
    const tw=ctx.measureText(txt).width;
    const tagY=cy+r+16+fSize;
    const padX=16,padY=5;
    /* Tag background */
    const rx=8;const tagW=tw+padX*2,tagH=fSize+padY*2;
    const tx=cx-tagW/2,ty=tagY-fSize-padY;
    ctx.beginPath();
    ctx.moveTo(tx+rx,ty);ctx.lineTo(tx+tagW-rx,ty);ctx.quadraticCurveTo(tx+tagW,ty,tx+tagW,ty+rx);
    ctx.lineTo(tx+tagW,ty+tagH-rx);ctx.quadraticCurveTo(tx+tagW,ty+tagH,tx+tagW-rx,ty+tagH);
    ctx.lineTo(tx+rx,ty+tagH);ctx.quadraticCurveTo(tx,ty+tagH,tx,ty+tagH-rx);
    ctx.lineTo(tx,ty+rx);ctx.quadraticCurveTo(tx,ty,tx+rx,ty);ctx.closePath();
    ctx.fillStyle=nameBgColor;ctx.fill();
    ctx.strokeStyle=accentColor+"55";ctx.lineWidth=1;ctx.stroke();
    /* Tag text */
    ctx.fillStyle="#fff";ctx.fillText(txt,cx,tagY);

    /* Resize handle indicator */
    const hx=cx+r*0.707,hy=cy+r*0.707;
    ctx.beginPath();ctx.arc(hx,hy,5,0,Math.PI*2);
    ctx.fillStyle=accentColor;ctx.fill();
    ctx.strokeStyle="#000";ctx.lineWidth=1;ctx.stroke();

  },[playerName,borderW,glowIntensity,nameFontSize,dimOpacity,accentColor,nameBgColor,circlePos,circleRadius,bgImage]);

  /* ── Drag circle ── */
  const handlePreviewMD=e=>{
    const rect=canvasRef.current.getBoundingClientRect();
    const mx=(e.clientX-rect.left)/rect.width*100;
    const my=(e.clientY-rect.top)/rect.height*100;
    const cx=circlePos.x,cy=circlePos.y;
    const r=circleRadius/100*100; /* simplified: in preview % space */
    const dist=Math.sqrt((mx-cx)**2+(my-cy)**2);

    /* Check if near the resize handle (bottom-right of circle) */
    const hx=cx+circleRadius*0.707*(rect.width/Math.min(rect.width,rect.height));
    const hy=cy+circleRadius*0.707*(rect.height/Math.min(rect.width,rect.height));
    const hdist=Math.sqrt((mx-hx)**2+(my-hy)**2);

    if(hdist<4){
      setResizing(true);
      const onMove=ev=>{
        const nx=(ev.clientX-rect.left)/rect.width*100;
        const ny=(ev.clientY-rect.top)/rect.height*100;
        const d=Math.sqrt((nx-circlePos.x)**2+((ny-circlePos.y)*(rect.width/rect.height))**2);
        setCircleRadius(Math.max(3,Math.min(40,d)));
      };

  /* ── PNG EXPORT — two-canvas pixel manipulation for true alpha=0 ── */
  const handleExport=()=>{
    const W=exportW,H=exportH;
    const cx=circlePos.x/100*W;
    const cy=circlePos.y/100*H;
    const radius=circleRadius/100*Math.min(W,H);

    /* Canvas 1: dark overlay, then manually zero out circle pixels */
    const c1=document.createElement("canvas");c1.width=W;c1.height=H;
    const ctx1=c1.getContext("2d");
    ctx1.fillStyle=`rgba(0,0,0,${dimOpacity})`;

    /* Pixel-by-pixel: set every pixel inside the circle to fully transparent */
    const imageData=ctx1.getImageData(0,0,W,H);

    const tagY=cy+radius+Math.round(20*sf)+fSize;

    ctx.lineTo(tx,ty+rx);ctx.quadraticCurveTo(tx,ty,tx+rx,ty);ctx.closePath();
    ctx.fillStyle=nameBgColor;ctx.fill();
    ctx.strokeStyle=accentColor+"55";ctx.lineWidth=sf;ctx.stroke();
    ctx.fillStyle="#fff";ctx.fillText(txt,cx,tagY);

    link.href=dataUrl;document.body.appendChild(link);link.click();document.body.removeChild(link);
  };

  /* ── Slider helper ── */

        style={{width:"100%",height:4,appearance:"none",background:C.s1,borderRadius:2,outline:"none",cursor:"pointer"}}/>
    </div>
  );

  return(
  <div style={{position:"fixed",inset:0,background:C.base,fontFamily:"'Inter',sans-serif",display:"flex",overflow:"hidden"}}>

          </div>
        </div>
      </div>

      {/* Controls */}
      <div style={{flex:1,overflowY:"auto",padding:20}}>
        {/* Player Name */}
        <div style={{marginBottom:16}}>

        </div>

        {/* Background image upload */}
        <div style={{marginBottom:20}}>
          <label style={{fontSize:11,color:C.sub,fontWeight:600,letterSpacing:0.5,display:"block",marginBottom:6}}>Preview Background</label>
          <label style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",borderRadius:8,border:`1px dashed ${C.s1}`,cursor:"pointer",transition:"border 0.2s",color:C.overlay,fontSize:12}}

            <input type="file" accept="image/*" onChange={handleBgUpload} style={{display:"none"}}/>
          </label>
          {bgImage&&<button onClick={()=>{setBgImage(null);bgRef.current=null;}} style={{fontSize:10,color:C.red,background:"none",border:"none",cursor:"pointer",marginTop:4}}>Remove background</button>}
        </div>
      </div>

      {/* Export button */}
      <div style={{padding:20,borderTop:`1px solid ${C.s1}`,flexShrink:0}}>
        <button onClick={handleExport}
          style={{width:"100%",padding:"14px 0",borderRadius:10,border:"none",cursor:"pointer",fontSize:14,fontWeight:800,letterSpacing:1,
            background:`linear-gradient(135deg,${accentColor},${accentColor}cc)`,color:"#000",
            boxShadow:`0 4px 20px ${accentColor}44`,transition:"transform 0.2s"}}
          onMouseEnter={e=>e.currentTarget.style.transform="translateY(-1px)"}
          onMouseLeave={e=>e.currentTarget.style.transform="none"}>
          <DownloadIcon size={16} color="#000" style={{verticalAlign:"middle",marginRight:8}}/>
          Download Overlay PNG
        </button>
        <div style={{fontSize:10,color:C.overlay,textAlign:"center",marginTop:8}}>
          Exports {exportW}×{exportH} transparent PNG
        </div>
      </div>
    </div>

    {/* ── PREVIEW AREA ── */}
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:40,background:C.base}}>
      <div ref={previewRef} style={{position:"relative",width:"100%",maxWidth:960,aspectRatio:"16/9"}}>

          Drag circle to reposition &bull; Drag green dot to resize
        </div>
      </div>
    </div>
  </div>);
}

  const resolvedTags=React.useMemo(()=>{

    const tagsByClip={};

  const clipFreezeDur=(clip,tagClips)=>{let fz=0;
    for(const tg of tagClips){if(tg.clipId===clip.id&&tg.sourceTime>=clip.clipStart&&tg.sourceTime<clip.clipEnd)fz+=tg.duration;}

    const allC=[];vt.forEach(t=>t.clips.forEach(c=>allC.push(c)));

  /* ═══ VIDEO POOL MANAGEMENT ═══
     Professional NLE technique: one pre-loaded <video> per clip on the timeline.
     Key insight: use OPACITY (not display:none) so browsers actually buffer the video.
     display:none tells the browser "this doesn't exist" and it won't download/decode.
     opacity:0 keeps the element "alive" — browser buffers it in the background.

  useEffect(()=>{

        const vel=pool[cid];if(vel.parentNode)vel.parentNode.removeChild(vel);

        delete pool[cid];
      }
    });

    allClips.forEach(c=>{
      if(c.kind==="image")return;
      if(!c.url){console.warn("Clip missing URL:",c.id,c.name);return;}
      if(!pool[c.id]){

           from disk would fail to load with it set */

  const freezeOffset=useCallback((clipStart,ph)=>{let total=0;for(const tg of resolvedTags){const tEnd=tg._tlStart+tg.duration;if(tEnd<=clipStart||tg._tlStart>=ph)continue;const s=Math.max(tg._tlStart,clipStart);const e=Math.min(tEnd,ph);if(e>s)total+=e-s;}return total;},[resolvedTags]);

  /* Defaults applied when a tag is created. Both stay freely resizable after —
     duration via the clip's right edge, size via the Spotlight Scale slider. */
  const FREEZE_DUR=1.5;
  const TAG_OVERLAY_DUR=1.5;
  const TAG_MAX_DUR=10;
  const SPOT_SCALE_DEFAULT=0.5;
  /* Spotlight tag colour — AUSA blue, matching the athlete portal and the Freeze

  const SPOT_COLOR=C.blue;

  const findOverlayTag=useCallback((clip,ph)=>{
    if(!clip)return null;

    for(const tg of tagTrack.clips){
      if(tg.clipId!==clip.id||tg.duration>0)continue; /* only zero-duration (non-freeze) tags */

  const findActiveClip=useCallback(ph=>{for(let i=tracks.length-1;i>=0;i--)for(const cl of tracks[i].clips){const rawD=cl.clipEnd-cl.clipStart;

  /* Photos live in Editor Media like videos and music: stored in IndexedDB, listed

  const addEditorImages=async files=>{

  const compactV1=useCallback((tagOverride)=>{

  const addClip=useCallback((trackId,data,start,isAudio=false)=>{pushHist();
